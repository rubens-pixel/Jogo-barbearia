function quarterActionHTML(){const groups=[['training','Treinamento da equipe'],['partnership','Aquisição e parcerias'],['retention','Fidelização'],['serviceFocus','Serviços extras'],['productFocus','Venda de produtos']];return `<h2>Estratégias para os próximos três meses</h2><p>Você pode combinar ações, desde que tenha caixa. Cada ação tem custo único e efeito explícito; escolha também não investir.</p>${groups.map(([k,title])=>`<h3>${title}</h3><div class="decision-grid">${managementOptions[k].map((a,i)=>`<div class="decision-card"><h3>${a.name}</h3><p>${a.desc}</p><strong>${fmt(a.cost)} · investimento único</strong><button class="${s[k]===i?'primary green':'secondary'}" onclick="chooseManagement('${k}',${i})">${s[k]===i?'✓ Selecionado':'Escolher'}</button></div>`).join('')}</div>`).join('')}<h3>Repor estoque de produtos</h3><p>Você tem ${s.productStock} unidades. Cada produto custa R$ 30 e é vendido por R$ 60.</p><label class="field">Unidades para comprar<input id="quarterStock" type="number" inputmode="numeric" min="0" max="1000" value="10"></label><button class="secondary" onclick="buyProducts()">Comprar estoque</button><h3>Organizar a equipe</h3>${s.barbers.map((b,i)=>`<div class="line"><span>${b.name} · comissão <select aria-label="Comissão de ${b.name}" onchange="setQuarterCommission(${i},this.value)">${[35,40,45,50,55].map(v=>`<option ${b.comm===v?'selected':''}>${v}</option>`).join('')}</select>%</span><button class="secondary mini" onclick="fireQuarter(${i})" ${s.barbers.length<=1?'disabled':''}>Desligar</button></div>`).join('')}<h3>Operação</h3><div class="decision-grid"><div class="decision-card"><h3>Recepcionista</h3><p>R$ 2.500 por mês.</p><button class="secondary" onclick="setQuarterReception(!s.receptionist)">${s.receptionist?'Dispensar':'Contratar'}</button></div><div class="decision-card"><h3>Limpeza</h3><p>Terceirizada: R$ 600/mês; interna: R$ 300/mês, reduz tempo da equipe.</p><button class="secondary" onclick="setQuarterClean(s.clean==='intern function nextQuarter(){if(s.month>=36||s.bankrupt){setStep(11);return}setStep(10)}function reportHTML(){const r=s.report;return `<div class="panel"><span class="pill">Diagnóstico personalizado</span><h2>${s.bankrupt?'Encerramento antecipado':`Trimestre encerrado · mês ${s.month}`}</h2>${stat()}<div class="line"><span>Cortes no trimestre</span><b>${r.cuts}</b></div><div class="line"><span>Faturamento do trimestre</span><b>${fmt(r.revenue)}</b></div><div class="line"><span>Ações estratégicas pagas no trimestre</span><b>${fmt(r.arr.reduce((a,x)=>a+(x.strategySpend||0),0))}</b></div><div class="line"><span>Resultado operacional</span><b class="${r.profit>=0?'good':'danger'}">${fmt(r.profit)}</b></div><div class="line"><span>Contas atrasadas</span><b>${fmt(s.arrears)}</b></div><h3 style="margin-top:20px">O que os resultados indicam</h3>${r.observations.map(t=>`<p class="warning">${t}</p>`).join('')}<h3>Fechamentos mensais</h3>${r.arr.map(x=>`<div class="line"><span>Mês ${x.month} · ${x.cuts} cortes</span><b class="${x.profit>=0?'good':'danger'}">${fmt(x.profit)}</b></div>`).join('')}${nav(null,'nextQuarter()',false,s.bankrupt||s.month>=36?'Ver relatório final':'Tomar decisões da próxima rodada')}</div>`}function summaryData(){const sum=k=>s.history.reduce((a,r)=>a+(r[k]||0),0);const positives=[],alerts=[];const losses=s.history.filter(r=>r.profit<0).length;const full=s.history.filter(r=>r.cuts>=r.capacity).length;const low=s.history.filter(r=>r.capacity>0&&r.cuts/r.capacity<.55).length;const marketingWaste=s.history.filter(r=>r.marketing>0&&r.cuts>=r.capacity).length;const first=s.history.slice(0,Math.min(3,s.history.length)).reduce((a,r)=>a+r.cuts,0);const last=s.history.slice(-Math.min(3,s.history.length)).reduce((a,r)=>a+r.cuts,0);if(sum('profit')>0)positives.push('Resultado operacional acumulado positivo: '+fmt(sum('profit'))+'.');if(s.month===36&&!s.bankrupt)positives.push('A empresa concluiu os 36 meses sem acionar a regra de falência.');if(last>first&&s.history.length>3)positives.push('Atendimentos aumentaram: '+first+' cortes nos primeiros três meses contra '+last+' nos últimos três.');if(sum('profit')<=0)alerts.push('Resultado operacional acumulado de '+fmt(sum('profit'))+'; reveja receitas e despesas.');if(losses)alerts.push(losses+' de '+s.month+' meses apresentaram prejuízo operacional.');if(s.arrears>0)alerts.push('Contas em atraso no encerramento: '+fmt(s.arrears)+'.');if(s.cash<fixed()*2)alerts.push('Caixa final inferior a dois meses das despesas fixas atuais.');if(low>=3)alerts.push('Capacidade abaixo de 55% de ocupação em '+low+' meses; avalie a relação entre equipe e procura.');if(marketingWaste)alerts.push('Marketing ativo com capacidade totalmente ocupada em '+marketingWaste+' meses; parte da procura adicional pode não ter virado atendimento.');if(s.bankrupt)alerts.push('Encerramento antecipado pela regra de inadimplência ou limite de dívida.');if(!positives.length)positives.push('Foram realizados '+sum('cuts')+' cortes durante a operação; use os dados para discutir as decisões tomadas.');if(!alerts.length)alerts.push('Não foram detectados os sinais de alerta definidos para este resumo; analise também as decisões registradas.');const decisions=s.decisions.filter(d=>/Abriu|Ampliou|Contratou|Alterou preço|marketing|Melhorou|ar-condicionado|Escolheu|produtos|Desligou|comissão|recepcionista|limpeza/i.test(d.msg));const key=[...decisions.slice(0,1),...decisions.slice(1).filter(d=>/Ampliou|Contratou|Alterou preço|marketing|Melhorou|ar-condicionado/i.test(d.msg)).slice(-5)];return {sum,positives:positives.slice(0,3),alerts:alerts.slice(0,3),key,losses,full,low}}function reportText(){const d=summaryData(),o=s.opening||{};return ['DO ZERO AO FUTURO — RELATÓRIO RESUMIDO','Participante: '+(s.playerName.trim()||'Não informado'),'Barbearia: '+(s.shopName.trim()||'Não informado'),'Código: '+(s.gameCode||'Não gerado'),'Data: '+new Date().toLocaleDateString('pt-BR'),'Situação: '+(s.bankrupt?'Falência':'36 meses concluídos'),'Meses: '+s.month+'/36','', 'RESULTADO','Investimento inicial: '+fmt(o.investment||0),'Caixa após abertura e estoque: '+fmt(o.initialCash||0),'Faturamento acumulado: '+fmt(d.sum('revenue')+d.sum('productRevenue')),'Resultado operacional acumulado: '+fmt(d.sum('profit')),'Caixa final: '+fmt(s.cash),'Contas em atraso: '+fmt(s.arrears),'Cortes: '+d.sum('cuts'),'Meses com prejuízo: '+d.losses,'','ABERTURA','Imóvel: '+(o.property||s.prop),'Postos: '+(o.stations??s.n),'Barbeiros: '+(o.barbers??s.barbers.length),'Preço do corte: '+fmt([40,60,100][o.tier??s.tier]),'Marketing mensal inicial: '+fmt(o.marketing||0),'','PRINCIPAIS DECISÕES',...d.key.map(x=>'Mês '+x.month+': '+x.msg),'','O QUE FUNCIONOU',...d.positives.map(x=>'• '+x),'','PONTOS DE ATENÇÃO',...d.alerts.map(x=>'• '+x),'','Análise baseada nesta partida. Não pressupõe que decisões alternativas teriam resultados garantidos.'].join('\n')}function downloadSummary(){const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='relatorio-'+(s.gameCode||'jogo')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function shareSummary(){const text=reportText();try{if(navigator.share){await navigator.share({title:'Relatório Do Zero ao Futuro',text});return}if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);alert('Relatório copiado! Cole no WhatsApp ou e-mail para enviar à equipe.');return}}catch(e){if(e.name==='AbortError')return}downloadSummary();alert('Relatório baixado em texto. Você pode anexá-lo ao WhatsApp ou e-mail.')}function finalHTML(){const d=summaryData(),o=s.opening||{};const rows=[['Investimento inicial',fmt(o.investment||0)],['Caixa após abertura e estoque',fmt(o.initialCash||0)],['Faturamento acumulado',fmt(d.sum('revenue')+d.sum('productRevenue'))],['Resultado operacional acumulado',fmt(d.sum('profit'))],['Caixa final',fmt(s.cash)],['Contas em atraso',fmt(s.arrears)],['Cortes realizados',String(d.sum('cuts'))],['Meses com prejuízo',String(d.losses)]];return `<div class="panel"><section id="shareReport"><span class="pill">Relatório resumido para compartilhar</span><h1>Do Zero ao Futuro</h1><p><b>Participante:</b> ${safe(s.playerName.trim()||'Não informado')} · <b>Barbearia:</b> ${safe(s.shopName.trim()||'Não informado')} · <b>Código:</b> ${safe(s.gameCode)}</p><p><b>Data:</b> ${new Date().toLocaleDateString('pt-BR')} · <b>Situação:</b> ${s.bankrupt?'Falência':'36 meses concluídos'} · <b>Meses:</b> ${s.month}/36</p><h2>Resultado da empresa</h2>${rows.map(([a,b])=>`<div class="line"><span>${a}</span><b>${b}</b></div>`).join('')}<h2>Decisões principais</h2><p>Imóvel ${safe(o.property||s.prop)} · ${o.stations??s.n} postos na abertura · ${o.barbers??s.barbers.length} barbeiro(s) na abertura · Corte inicial ${fmt([40,60,100][o.tier??s.tier])} · Marketing inicial ${fmt(o.marketing||0)}/mês.</p>${d.key.length?d.key.map(x=>`<p class="summary-point"><b>Mês ${x.month}:</b> ${safe(x.msg)}</p>`).join(''):'<p>Sem mudanças estratégicas adicionais registradas.</p>'}<h2>O que funcionou</h2>${d.positives.map(x=>`<p class="summary-point good">✓ ${safe(x)}</p>`).join('')}<h2>Pontos de atenção</h2>${d.alerts.map(x=>`<p class="summary-point">• ${safe(x)}</p>`).join('')}<p class="muted"><small>Diagnóstico baseado nos resultados observados desta partida, sem afirmar resultados de escolhas não simuladas.</small></p></section><div class="actions no-print"><button class="primary green" onclick="window.print()">Gerar PDF / imprimir</button><button class="primary" onclick="shareSummary()">Compartilhar relatório</button><button class="secondary" onclick="downloadSummary()">Baixar resumo (.txt)</button><button class="secondary" onclick="location.reload()">Recomeçar</button></div><p class="muted no-print">Para gerar o PDF, toque em “Gerar PDF / imprimir” e escolha “Salvar como PDF” nas opções do dispositivo. O envio é feito por você; os dados não são coletados automaticamente.</p></div>`}function render(){let intro=s.step<0,stage=intro?s.step+3:Math.min(s.step+3,10);let html=`<div class="panel"><span class="pill">${s.month?`Mês ${s.month} de 36`:`Abertura · etapa ${stage} de 10`}</span><div class="progress"><span style="width:${s.month?s.month/36*100:stage/10*100}%"></span></div>${intro?'':stat()}</div>`;if(s.step===-2)html+=`<div class="panel"><h1>1. Qual é o seu nome?</h1><p>Seu nome aparecerá no relatório final para a equipe analisar sua partida.</p><label class="field">Nome do participante<input type="text" maxlength="90" autocomplete="name" placeholder="Digite seu nome" value="${safe(s.playerName)}" oninput="setPlayerName(this.value)"></label><div class="actions"><button class="primary green" onclick="advanceIdentity(-1)">Continuar →</button></div></div>`;if(s.step===-1)html+=`<div class="panel"><h1>2. Dê um nome à sua barbearia</h1><p>Agora escolha o nome do negócio que você vai construir.</p><label class="field">Nome da barbearia<input type="text" maxlength="90" placeholder="Ex.: Barbearia Futuro" value="${safe(s.shopName)}" oninput="setShopName(this.value)"></label><div class="actions"><button class="secondary" onclick="setStep(-2)">← Voltar</button><button class="primary green" onclick="advanceIdentity(0)">Escolher imóvel →</button></div></div>`;if(s.step===0)html+=`<div class="panel"><h1>3. Escolha onde abrir</h1><p class="muted">Cada imóvel tem custos e procura diferentes. A caução fica retida e não conta como despesa operacional.</p><div class="cards">${props.map(p=>`<button class="choice ${s.prop===p.id?'active':''}" onclick="selectProp('${p.id}')"><img class="location-photo" src="${PHOTO_ASSETS['location_'+p.id]}" alt="Imagem ilustrativa do bairro ${p.name}"><strong>${p.id} · ${p.name}</strong><p>${p.desc}</p><small>Aluguel ${fmt(p.rent)} / mês</small><small>Reforma ${fmt(p.reno)}</small><small>Até ${p.max} postos</small></button>`).join('')}</div>${nav(-1,'setStep(1)',!s.prop)}</div>`;if(s.step===1)html+=`<div class="panel"><h1>Quantos postos você vai montar?</h1><p>Você só poderá contratar barbeiros para postos completos.</p><div class="cards">${Array.from({length:P().max-2},(_,i)=>i+3).map(n=>`<button class="choice ${s.n===n?'active':''}" onclick="count(${n})"><div class="candidate-icon" aria-hidden="true">${"✂️".repeat(n)}</div><strong>${n} postos</strong><small>${n>3?2:1} lavatório(s) obrigatório(s)</small></button>`).join('')}</div>${nav(0,'stationInit();setStep(2)')}</div>`;if(s.step===2){stationInit();html+=`<div class="panel"><h1>Escolha os modelos dos seus postos</h1><p class="muted">Uma escolha por equipamento: todas as ${s.n} cadeiras serão iguais, todas as bancadas serão iguais e todos os espelhos serão iguais. Cada cartão mostra o preço unitário e o total. Imagens incorporadas e ampliadas. Cadeiras e lavatórios têm fotos ilustrativas; bancadas, espelhos e recepções ainda usam ilustrações, não fotos reais de fabricantes.</p>${['chair','bench','mirror'].map(k=>`<h2>${names[k]} · ${s.n} unidades iguais</h2><div class="cards product-cards">${catalog[k].slice(0,3).map(([name,price],j)=>`<button class="choice ${s.stations[0][k]===j?'active':''}" onclick="pickItem('${k}',0,${j})"><img class="${k==='chair'?'photo-real':'photo-art'}" src="${photo(k,j)}" alt="${names[k]} ${name}"><strong>${name}</strong><small>${fmt(price)} cada · ${fmt(price*s.n)} no total</small></button>`).join('')}</div>`).join('')}<h2>Lavatórios · ${s.wash.length} obrigatório(s)</h2>${s.wash.map((v,i)=>`<h3>Lavatório ${i+1}</h3><div class="cards product-cards">${catalog.wash.map(([name,price],j)=>`<button class="choice ${v===j?'active':''}" onclick="pickItem('wash',${i},${j})"><img class="photo-real" src="${photo('wash',j)}" alt="Lavatório ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div>`).join('')}${!allEquipment()?warn('Escolha cadeira, bancada, espelho e todos os lavatórios para continuar.'):''}${setupCost()>100000?warn('O investimento excede o capital disponível. Ajuste os modelos.'):''}${nav(1,'setStep(3)',!allEquipment()||setupCost()>100000)}</div>`}if(s.step===3)html+=`<div class="panel"><h1>Conforto e operação</h1><p>Itens opcionais; climatização insuficiente reduz a experiência, sem penalidade fixa automática de faturamento.</p><h3>Ar-condicionado · ${fmt(4000)} cada</h3><div class="cards product-cards">${Array.from({length:P().ac+1},(_,i)=>i).map(n=>`<button class="choice ${s.ac===n?'active':''}" onclick="s.ac=${n};render()"><img src="${n?PHOTO_ASSETS.ac:photo('reception',0)}" alt="${n?'Ar-condicionado':'Sem ar-condicionado'}"><strong>${n} aparelho(s)</strong><small>${fmt(n*4000)} ${n===P().ac?'· Climatização adequada':''}</small></button>`).join('')}</div><h3>Recepção física</h3><div class="cards product-cards">${catalog.reception.map(([name,price],i)=>`<button class="choice ${s.reception===i?'active':''}" onclick="s.reception=${i};render()"><img class="photo-art" src="${photo('reception',i)}" alt="Desenho ilustrativo da recepção ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div><h3>Recepcionista</h3><div class="cards"><button class="choice ${!s.receptionist?'active':''}" onclick="s.receptionist=false;render()"><div class="candidate-icon" aria-hidden="true">—</div>Não contratar</button><button class="choice ${s.receptionist?'active':''}" onclick="s.receptionist=true;render()"><div class="candidate-icon" aria-hidden="true">👤</div>Contratar · R$ 2.500/mês</button></div><h3>Limpeza</h3><div class="cards"><button class="choice ${s.clean==='outsourced'?'active':''}" onclick="s.clean='outsourced';render()"><div class="candidate-icon" aria-hidden="true">🧹</div>Terceirizada · R$ 600/mês</button><button class="choice ${s.clean==='internal'?'active':''}" onclick="s.clean='internal';render()"><div class="candidate-icon" aria-hidden="true">🧽</div>Interna · R$ 300/mês (usa tempo da equipe)</button></div>${setupCost()>100000?warn('Montagem ultrapassa R$ 100 mil. Reduza algum item.'):''}${nav(2,'setStep(4)',setupCost()>100000)}</div>`;if(s.step===4)html+=`<div class="panel"><h1>Confira seu investimento</h1><div class="line"><span>Caução</span><b>${fmt(P().rent*3)}</b></div><div class="line"><span>Reforma instantânea</span><b>${fmt(P().reno)}</b></div><div class="line"><span>Documentação e materiais iniciais</span><b>${fmt(3000)}</b></div><div class="line"><span>Equipamentos e opcionais</span><b>${fmt(equipCost())}</b></div><div class="line"><span>Total de abertura</span><b>${fmt(setupCost())}</b></div><div class="line"><span>Caixa após abertura</span><b>${fmt(100000-setupCost())}</b></div><div class="line"><span>Despesas mensais conhecidas</span><b>${fmt(fixed())}</b></div>${warn('A reserva não é lucro. O mês 1 começa com a loja aberta; todas as despesas mensais são cobradas integralmente.')}${nav(3,'setStep(5)',setupCost()>100000)}</div>`;if(s.step===5)html+=`<div class="panel"><h1>Contrate sua equipe</h1><p>Você tem ${s.n} postos e ${s.barbers.length} barbeiro(s). Contratar não cria clientes automaticamente. Comissão negociável de 35% a 55%.</p><div class="cards">${candidates().map((c,i)=>`<div class="choice"><div class="candidate-icon" aria-hidden="true">✂️</div><strong>${c.name}</strong><p>${c.desc}</p><small>Comissão inicial sugerida: ${c.comm}%</small><button class="primary" onclick="hire(${i})" ${s.barbers.length>=s.n?'disabled':''}>Contratar</button></div>`).join('')}</div><h3>Equipe contratada</h3>${s.barbers.map((b,i)=>`<div class="line"><span>${b.name} <button class="secondary mini" onclick="fire(${i})">Remover</button></span><label>Comissão <select onchange="changeComm(${i},this.value)">${[35,40,45,50,55].map(n=>`<option value="${n}" ${b.comm===n?'selected':''}>${n}%</option>`).join('')}</select></label></div>`).join('')}${nav(4,'setStep(6)',!s.barbers.length)}</div>`;if(s.step===6)html+=`<div class="panel"><h1>Escolha seu posicionamento</h1><p>O preço influencia receita e procura. Serviços extras seguem o posicionamento e habilidade da equipe.</p><div class="cards">${['Econômico','Intermediário','Premium'].map((name,i)=>`<button class="choice ${s.tier===i?'active':''}" onclick="chooseTier(${i})"><div class="candidate-icon" aria-hidden="true">${["R$","✂️","★"][i]}</div><strong>${name}</strong><small>Corte ${fmt([40,60,100][i])}</small><small>Extra médio ${fmt([20,35,60][i])}</small></button>`).join('')}</div>${nav(5,'setStep(7)')}</div>`;if(s.step===7)html+=`<div class="panel"><h1>Divulgação e estoque</h1><p>O marketing é escolhido em reais por mês. Produtos custam R$ 30 e são vendidos por R$ 60, limitados ao estoque.</p><label class="field">Marketing mensal (R$)<input type="number" min="0" step="100" value="${s.marketing}" onchange="setMarketing(this.value)"></label><label class="field">Estoque inicial de produtos (unidades)<input type="number" min="0" step="1" value="${s.productStock}" onchange="setStock(this.value)"></label><label class="field">Retirada mensal do dono (R$)<input type="number" min="0" step="100" value="${s.ownerPay}" onchange="setOwner(this.value)"></label><div class="line"><span>Caixa após montagem e estoque</span><b>${fmt(100000-setupCost()-s.productStock*30)}</b></div><div class="line"><span>Despesas mensais + marketing + retirada, antes de comissões</span><b>${fmt(fixed()+s.marketing+s.ownerPay)}</b></div>${100000-setupCost()-s.productStock*30<fixed()+s.marketing?warn('O caixa não cobre as despesas fixas e marketing previstos para o primeiro mês. Ajuste as escolhas para inaugurar.'):''}${nav(6,'finishOpening()',!allEquipment()||!s.barbers.length||setupCost()+s.productStock*30+fixed()+s.marketing>100000,'Inaugurar')}</div>`;if(s.step===8)html+=`<div class="panel"><h1>Sua barbearia está aberta!</h1><p>Reforma instantânea. O primeiro mês já pode faturar. O jogo calcula três fechamentos mensais e entrega um diagnóstico ao fim da rodada.</p><div class="line"><span>Imóvel</span><b>${P().name}</b></div><div class="line"><span>Barbeiros</span><b>${s.barbers.length}</b></div><div class="line"><span>Preço do corte</span><b>${fmt([40,60,100][s.tier])}</b></div><div class="line"><span>Procura-base inicial</span><b>${s.baseDemand} cortes/mês</b></div>${nav(null,'runQuarter()',false,'Simular trimestre')}</div>`;if(s.step===9)html+=reportHTML();if(s.step===10)html+=`<div class="panel"><h1>Decisões da próxima rodada</h1><p>As mudanças passam a valer nos três meses seguintes. A ordem permanece: instalar posto antes de contratar.</p>${quarterActionHTML()}<h3>Expansão da estrutura</h3><p>${s.n} de ${P().max} postos. Ampliação Essencial custa ${fmt(catalog.chair[s.stations[0].chair][1]+catalog.bench[s.stations[0].bench][1]+catalog.mirror[s.stations[0].mirror][1]+(s.n===3?1500:0))} quando aplicável.</p><button class="secondary" onclick="addStation()" ${s.n>=P().max||s.cash<catalog.chair[s.stations[0].chair][1]+catalog.bench[s.stations[0].bench][1]+catalog.mirror[s.stations[0].mirror][1]+(s.n===3?1500:0)?'disabled':''}>Instalar mais um posto</button><button class="secondary" onclick="upgradeAC()" ${s.ac>=P().ac||s.cash<4000?'disabled':''}>Adicionar ar-condicionado · R$ 4.000</button><h3>Reforma e equipamentos (opcionais)</h3><p>Trocar cadeira não é a única forma de crescer. Invista primeiro nas estratégias acima se fizer mais sentido. Escolha um modelo para toda a loja; cada troca revende os equipamentos antigos por 50% do preço original. Signature fica disponível após a inauguração.</p>${['chair','bench','mirror'].map(k=>`<h3>${names[k]} · trocar ${s.n} unidades</h3><div class="cards product-cards">${catalog[k].map(([name,price],j)=>`<button class="choice ${s.stations[0][k]===j?'active':''}" onclick="upgradeItem(0,'${k}',${j})"><img class="${k==='chair'?'photo-real':'photo-art'}" src="${photo(k,j)}" alt="${names[k]} ${name}"><strong>${name}</strong><small>${s.stations[0][k]===j?'Modelo atual':`Troca das ${s.n}: ${fmt((price-Math.round(catalog[k][s.stations[0][k]][1]*.5))*s.n)}`}</small></button>`).join('')}</div>`).join('')}<h3>Contratação para vagas disponíveis</h3><p>${s.barbers.length} barbeiros para ${s.n} postos.</p><div class="cards">${candidates().map((c,i)=>`<button class="secondary" onclick="hireQuarter(${i})" ${s.barbers.length>=s.n?'disabled':''}>Contratar ${c.name} · ${c.comm}%</button>`).join('')}</div><h3>Reposicionamento do preço do corte</h3><div class="cards">${['Econômico','Intermediário','Premium'].map((n,i)=>`<button class="choice ${s.tier===i?'active':''}" onclick="adjustTier(${i})"><div class="candidate-icon" aria-hidden="true">${["R$","✂️","★"][i]}</div><strong>${n}</strong><small>${fmt([40,60,100][i])}</small></button>`).join('')}</div><label class="field">Marketing mensal (R$)<input type="number" min="0" step="100" value="${s.marketing}" onchange="adjustMarketing(this.value)"></label><label class="field">Retirada mensal do dono (R$)<input type="number" min="0" step="100" value="${s.ownerPay}" onchange="setOwner(this.value)"></label>${s.cash<fixed()+s.marketing?warn('Atenção: o caixa disponível não cobre o próximo mês de despesas fixas e marketing. O jogo permite continuar, mas há risco de contas atrasadas.'):''}${nav(null,'setStep(8)',false,'Confirmar decisões')}</div>`;if(s.step===11)html+=finalHTML();el.innerHTML=html}render();</script></body></html>
