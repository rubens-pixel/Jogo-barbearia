<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1a9b"><title>Do Zero ao Futuro 2.0 | O Barbeiro da Cidade</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182044;background:#edf1f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1140px;margin:auto;padding:16px}.hero{background:#14154e;color:white;padding:23px;border-radius:20px;margin:12px 0}.hero h1{margin:4px 0;font-size:clamp(25px,5vw,39px)}.lime{color:#b2df20}.muted{color:#66708a}.hero .muted{color:#cbd0e9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #dce2ef;border-radius:16px;padding:17px;margin:12px 0}.card h3{margin:4px 0 8px}.option{border:2px solid #dce2ef;background:#fff;text-align:left;border-radius:14px;padding:13px;width:100%;min-height:80px;color:#182044}.option.active{border-color:#1d1a9b;background:#f0f0ff}.option.active:after{content:'✓ ESCOLHIDO';display:block;color:#1d1a9b;font-weight:900;font-size:11px;margin-top:8px}.option small{display:block;color:#67718a;line-height:1.45;margin-top:5px}.btn{background:#1d1a9b;color:#fff;border:0;border-radius:12px;padding:13px 17px;font-weight:750}.btn.alt{background:#e9edfa;color:#1d1a9b}.btn.green{background:#b2df20;color:#12143f}.btn.red{background:#9e263a}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.row>*{min-width:0}.nav{display:flex;gap:7px;overflow:auto;padding:6px 0}.nav button{border:0;border-radius:20px;background:#dce2f3;color:#202858;padding:10px 14px;white-space:nowrap}.nav button.active{background:#1d1a9b;color:#fff}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.kpi{background:#f2f4fa;padding:12px;border-radius:12px}.kpi b{display:block;font-size:20px;color:#1d1a9b;margin-top:4px}.kpi small{color:#66708a}.warn{background:#fff4d8;border-left:5px solid #d79c15;padding:13px;border-radius:10px;margin:12px 0}.ok{background:#e7f8e2;border-left:5px solid #6ea91a;padding:13px;border-radius:10px;margin:12px 0}.bad{background:#ffebeb;border-left:5px solid #cf364c;padding:13px;border-radius:10px;margin:12px 0}.cols{display:grid;grid-template-columns:1fr 300px;gap:15px}.section{border-top:1px solid #e3e7ef;padding-top:12px;margin-top:17px}.field{width:100%;border:1px solid #cbd2e4;border-radius:10px;padding:12px;background:white;margin:6px 0 12px}label{display:block;font-weight:700;font-size:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid #e1e5ef}th{color:#515d77}.scroll{overflow:auto}.tag{background:#e8edff;color:#1d1a9b;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions button{flex:1;min-width:145px}.meter{height:10px;border-radius:9px;background:#e3e8f3;overflow:hidden}.meter span{height:100%;background:#1d1a9b;display:block}.small{font-size:12px}.chart{display:flex;align-items:end;gap:3px;height:110px;border-bottom:1px solid #bbc3d5}.chart div{flex:1;min-width:3px;background:#1d1a9b;border-radius:3px 3px 0 0}.event{border:2px solid #1d1a9b;border-radius:16px;padding:16px;background:#f7f8ff;margin:14px 0}.event .option{margin:6px 0}.hidden{display:none}footer{padding:35px 0;color:#67718a;text-align:center;font-size:12px}@media(max-width:740px){.cols{grid-template-columns:1fr}.wrap{padding:10px}.hero{padding:17px}.card,.panel{padding:14px}.kpi b{font-size:17px}}
</style></head><body><div class="wrap"><header class="hero"><div class="row"><span class="tag">O BARBEIRO DA CIDADE • MENTORIA</span><span class="small">JOGO 2.0 • 36 MESES</span></div><h1>DO ZERO <span class="lime">AO FUTURO</span></h1><p class="muted">R$ 100 mil. Sua estrutura. Sua equipe. Suas decisões. Três anos de consequências.</p></header><nav class="nav" id="nav"></nav><div class="cols"><main id="app"></main><aside id="side"></aside></div><footer>Simulação didática com valores fictícios. Não é projeção de faturamento ou aconselhamento financeiro. Progresso salvo somente neste navegador.</footer></div><script>
'use strict';
const KEY='obc-jogo-36m-v1',money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}),round=n=>Math.round(n),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const places=[{name:'Bairro residencial',desc:'Casas, poucos prédios e comércio limitado. Movimento concentrado no início e no fim do dia.',max:4,rent:2500,deposit:7500,reno:8000,base:110,low:35,high:65,highValue:0.75,traffic:.8,ac:4500},{name:'Bairro misto',desc:'Prédios comerciais e residenciais, academias, lojas e restaurantes. Movimento diurno e noturno.',max:6,rent:5000,deposit:15000,reno:6000,base:255,low:45,high:80,highValue:1.04,traffic:1.16,ac:9000},{name:'Centro comercial',desc:'Circulação intensa durante o dia, público sensível a preço e competição elevada.',max:6,rent:4500,deposit:13500,reno:7000,base:225,low:35,high:45,highValue:.65,traffic:1.13,ac:9000},{name:'Bairro nobre',desc:'Alto padrão, expectativa de experiência elevada, aluguel caro e duas vagas.',max:6,rent:8000,deposit:24000,reno:10000,base:135,low:80,high:120,highValue:1.35,traffic:.87,ac:9000},{name:'Rua secundária',desc:'Pouco fluxo espontâneo, acesso discreto e quatro vagas. Depende de atração e fidelização.',max:5,rent:4000,deposit:12000,reno:14000,base:92,low:65,high:120,highValue:1.23,traffic:.68,ac:9000}];
const catalog={chair:{label:'Cadeira',per:true,opts:[['Exclusive 100',1800,1],['Prisma 2',3500,1.5],['Alfa Romeo',7000,2.3]]},bench:{label:'Bancada',per:true,opts:[['Urban',900,1],['Concept',2000,1.6],['Signature',4000,2.3]]},mirror:{label:'Espelho',per:true,opts:[['Line',400,1],['Vision',900,1.5],['Infinity',1800,2.1]]},wash:{label:'Lavatório',opts:[['Flow',2000,1],['Relax',5000,2]]},reception:{label:'Recepção',opts:[['Start',2000,1],['Connect',5000,1.6],['Lounge',10000,2.4]]},facade:{label:'Fachada',opts:[['Street',2500,1],['Horizon',6000,1.6],['Monument',12000,2.5]]}};
const staffTypes=[{name:'Em desenvolvimento',commission:.45,capacity:90,quality:.85,hire:1200},{name:'Experiente',commission:.50,capacity:125,quality:1,hire:1800},{name:'Especialista',commission:.55,capacity:140,quality:1.13,hire:2600}];
const defaultState=()=>({name:'',shop:'',stage:0,loc:null,n:0,sel:{chair:null,bench:null,mirror:null,wash:null,reception:null,facade:null},washN:1,price:null,initialStaff:[0,0,0],locked:false,month:1,cash:0,chairs:0,staff:[0,0,0],levels:{chair:0,bench:0,mirror:0,wash:0,reception:0,facade:0},washCount:1,acExtra:0,marketing:500,software:0,retention:0,reputation:50,loyal:0,training:0,priceChangeMonth:0,marketingHistory:[],pendingHires:[],eventDone:{},eventEffects:{},history:[],log:[],debt:0,borrowed:false,aporte:false,ended:false});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||defaultState();if(!s.history||!s.sel)throw Error('old')}catch(e){s=defaultState()}let page=s.stage===0?'intro':s.stage===1?'build':s.stage===2?'team':s.ended?'end':'month';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function setPage(p){if(s.locked&&['intro','build','team'].includes(p))return;page=p;render()}function option(label,desc,active,fn){return `<button type="button" class="option ${active?'active':''}" onclick="${fn}"><b>${label}</b>${desc?`<small>${desc}</small>`:''}</button>`}function sel(k,i){if(s.locked)return;s.sel[k]=i;save();render()}function chooseLoc(i){if(s.locked)return;s.loc=i;s.n=clamp(s.n,0,places[i].max);save();render()}function setN(v){if(s.locked)return;s.n=Number(v);save();render()}function cost(){let l=places[s.loc];if(!l)return null;let incomplete=s.n<2||Object.values(s.sel).some(v=>v===null);let per=['chair','bench','mirror'].reduce((a,k)=>a+(s.sel[k]===null?0:catalog[k].opts[s.sel[k]][1]),0)+1500;let other=['wash','reception','facade'].reduce((a,k)=>a+(s.sel[k]===null?0:catalog[k].opts[s.sel[k]][1]*(k==='wash'?s.washN:1)),0);let total=l.deposit+l.reno+l.ac+7500+s.n*per+other;let fixed=l.rent+3000;return {total,cash:100000-total,reserve:2*fixed,fixed,valid:!incomplete&&100000-total>=2*fixed,incomplete}}
function experience(){let q=s.levels,quality=(catalog.chair.opts[q.chair][2]*.24+catalog.bench.opts[q.bench][2]*.21+catalog.mirror.opts[q.mirror][2]*.08+catalog.reception.opts[q.reception][2]*.21+catalog.facade.opts[q.facade][2]*.13+catalog.wash.opts[q.wash][2]*.13);let l=places[s.loc],crowding=s.chairs>3?Math.max(0,s.chairs-3)*.15:0,acNeed=(l.max>=5?1:0)+(s.chairs>=5?1:0),acComfort=clamp(1+s.acExtra*.15-crowding*.12-(acNeed>s.acExtra?(.12*(acNeed-s.acExtra)):0),.72,1.15);return {quality,acComfort,score:quality*acComfort}}
function initialStaffCount(){return s.initialStaff.reduce((a,b)=>a+b,0)}function staffCount(){return s.staff.reduce((a,b)=>a+b,0)}function avgQuality(){let n=staffCount();return n?s.staff.reduce((a,n,i)=>a+n*staffTypes[i].quality,0)/n:0}function capacity(){return s.staff.reduce((a,n,i)=>a+n*(staffTypes[i].capacity+(s.training?8:0)),0)}function priceFit(){let l=places[s.loc],p=s.price;let ratio=p<l.low?1.08:p<=l.high?1:Math.max(.40,1-.45*(p-l.high)/l.high);let exp=experience().score,threshold=p>=80?1.35:p>=65?1.12:.8;let mismatch=exp<threshold?clamp(1-(threshold-exp)*.33,.70,1):clamp(1+(exp-threshold)*.06,1,1.08);if(s.loc===3&&p>=80)mismatch*=clamp(.84+(exp-1)*.16,.76,1.06);if(s.loc===4&&p>=80)mismatch*=clamp(.86+(exp-1)*.19,.74,1.12);return {ratio,mismatch}}
function deterministic(month){return [1,.85,1.15,.92,1.08,.76,1.19,.94,1.04,.83,1.13,.98][(month-1)%12]}
function eventFor(m){return events.find(e=>e.month===m)}
const events=[{month:3,title:'Um profissional pediu para sair',desc:'Uma cadeira produtiva pode ficar vazia. O que você faz?',options:[['Recrutamento acelerado','R$ 3.000; profissional experiente entra no próximo mês.',3000,'quitFast'],['Buscar com calma','R$ 500; profissional em desenvolvimento entra em dois meses.',500,'quitSlow'],['Esperar aparecer alguém','Sem gasto; uma oportunidade de contratação surge em quatro meses.',0,'quitWait']]},{month:5,title:'Reclamações sobre a espera',desc:'Se a ocupação estiver alta, o risco de perder clientes é maior. Você precisa responder.',options:[['Melhorar agendamento','R$ 1.500; menos faltas e mais retenção.',1500,'waitSoftware'],['Treinar atendimento','R$ 2.000; melhora retenção e produtividade no mês seguinte.',2000,'waitTrain'],['Não agir','Sem custo; se houver lotação, a reputação sofre.',0,'waitNone']]},{month:8,title:'Hora de pensar em expansão',desc:'Você pode investir para crescer ou preservar caixa.',options:[['Investir na captação','R$ 3.000 adicionais em campanha neste mês.',3000,'expandMarketing'],['Programa de relacionamento','R$ 2.000; aumenta retorno de clientes.',2000,'expandLoyal'],['Preservar caixa','Sem custo adicional.',0,'expandNone']]},{month:10,title:'Um concorrente abriu na região',desc:'Parte dos novos clientes considera outra opção.',options:[['Diferenciar a experiência','R$ 4.000; reduz perda de demanda por seis meses.',4000,'competitorExperience'],['Campanha de fidelização','R$ 2.000; melhora retorno por seis meses.',2000,'competitorLoyal'],['Não reagir','Sem custo; demanda cai por seis meses.',0,'competitorNone']]},{month:13,title:'Reajuste de aluguel',desc:'O proprietário propôs aumento de 12%.',options:[['Aceitar reajuste','Aluguel sobe 12% permanentemente.',0,'rentAccept'],['Negociar','Pagar R$ 1.000; reajuste fica em 6%.',1000,'rentNegotiate'],['Contestar e adiar','Pagar R$ 2.000; aluguel mantém valor por três meses e sobe 15% no mês 16.',2000,'rentDelay']]},{month:15,title:'Pedido de comissão maior',desc:'Um profissional experiente ou especialista quer rever a remuneração.',options:[['Conceder reajuste','Comissões aumentam 2 pontos percentuais permanentemente.',0,'commissionYes'],['Treinamento e plano de carreira','R$ 2.500; melhora retenção da equipe.',2500,'commissionTrain'],['Não negociar','Sem custo; maior risco de perder um profissional.',0,'commissionNo']]},{month:17,title:'Oportunidade de expansão',desc:'Você pode preparar o negócio para o próximo ciclo.',options:[['Campanha de aquisição','R$ 5.000; melhora a procura por três meses.',5000,'growthCampaign'],['Relacionamento com clientes','R$ 3.000; aumenta retenção permanentemente.',3000,'growthRetention'],['Não investir','Mantém caixa.',0,'growthNone']]},{month:19,title:'Clientes estão deixando de voltar',desc:'A fidelização está sob pressão.',options:[['Treinar toda a equipe','R$ 3.000; melhora serviço e retenção.',3000,'retTrain'],['Programa de relacionamento','R$ 2.000; aumenta recorrência.',2000,'retLoyal'],['Manter estratégia','Sem custo; reputação sofre.',0,'retNone']]},{month:21,title:'Uma campanha foi abaixo do esperado',desc:'Seu próximo investimento em marketing exige uma escolha.',options:[['Revisar campanhas','R$ 1.500; melhora eficiência por seis meses.',1500,'marketingReview'],['Aumentar alcance','R$ 3.000; reforça a procura neste mês.',3000,'marketingBoost'],['Pausar campanha','Marketing mensal vai a zero até você mudar.',0,'marketingPause']]},{month:25,title:'Mudança no comportamento dos clientes',desc:'Alguns clientes valorizam conveniência; outros, experiência.',options:[['Serviços rápidos','R$ 5.000; capacidade aumenta em 8% e preço médio de extras diminui.',5000,'trendFast'],['Experiência personalizada','R$ 5.000; aumenta retenção e venda de extras.',5000,'trendExperience'],['Pesquisar clientes','R$ 1.500; reputação melhora moderadamente.',1500,'trendResearch']]},{month:27,title:'Um profissional recebeu uma proposta',desc:'Você pode tentar manter o profissional ou reorganizar a operação.',options:[['Plano de retenção','R$ 3.000; mantém equipe e eleva comissões em 1 ponto.',3000,'staffKeep'],['Recrutar substituto','R$ 2.000; perde um profissional e repõe no mês seguinte.',2000,'staffReplace'],['Deixar sair e esperar','Sem custo; perde um profissional por três meses.',0,'staffLeave']]},{month:29,title:'Modernização da operação',desc:'Seu negócio pode investir em tecnologia ou estrutura.',options:[['Software e automação','R$ 5.000; reduz faltas e melhora retenção.',5000,'modernSoftware'],['Melhoria da experiência','R$ 5.000; melhora percepção do cliente.',5000,'modernExperience'],['Preservar caixa','Sem custo.',0,'modernNone']]},{month:31,title:'A concorrência mudou os preços',desc:'Você precisa responder sem destruir sua margem.',options:[['Reforçar diferenciação','R$ 3.000; reduz perda de clientes.',3000,'priceDiffer'],['Investir em fidelização','R$ 2.000; protege recorrência.',2000,'priceLoyal'],['Manter estratégia','Sem custo; perde parte da procura por quatro meses.',0,'priceNone']]},{month:33,title:'Seu imóvel está no limite?',desc:'A demanda pode justificar ampliar ou mudar a operação.',options:[['Planejar expansão','R$ 4.000; gera demanda e melhora processos.',4000,'finalExpand'],['Fortalecer o negócio atual','R$ 3.000; melhora retenção.',3000,'finalLoyal'],['Guardar caixa','Sem investimento.',0,'finalNone']]}];
function eventEffect(m){let e=eventFor(m);if(!e)return null;let chosen=s.eventDone[m];return chosen==null?null:e.options[chosen][3]}
function changeStaff(i,delta){let n=s.initialStaff.slice();n[i]=Math.max(0,n[i]+delta);if(n.reduce((a,b)=>a+b,0)>s.n)return;s.initialStaff=n;save();render()}
function initOperation(){let c=cost();if(!c.valid||s.price==null||initialStaffCount()<1||initialStaffCount()>s.n){alert('Confira orçamento, preço e equipe inicial.');return}let hireCost=s.initialStaff.reduce((a,n,i)=>a+n*staffTypes[i].hire,0);if(c.cash-hireCost<c.reserve){alert('Os custos de contratação comprometem a reserva. Ajuste a equipe ou a montagem.');return}if(!approve('Inaugurar '+s.shop, c.total+hireCost,'Imóvel: '+places[s.loc].name+' | '+s.n+' cadeiras | '+initialStaffCount()+' profissionais | Corte '+money(s.price)+' | Caixa restante '+money(c.cash-hireCost)+'\nA montagem, o imóvel e a equipe inicial ficarão definitivos.'))return;s.cash=c.cash-hireCost;s.chairs=s.n;s.staff=s.initialStaff.slice();s.levels={...s.sel};s.washCount=s.washN;s.stage=3;s.locked=true;s.log.push('Abertura: '+s.chairs+' cadeiras, '+staffCount()+' profissionais, preço '+money(s.price)+', caixa '+money(s.cash));save();setPage('month')}
function renderIntro(){return `<section class="card"><h2>Você é o dono. A empresa reage.</h2><p>Monte a barbearia com R$ 100.000 e administre 36 meses. Cada decisão altera procura, capacidade, retenção, despesas ou caixa. Você poderá contratar, expandir, trocar equipamentos, investir em marketing e responder a crises.</p><div class="warn"><b>Importante:</b> é um jogo didático. Os números são fictícios e o resultado depende de regras transparentes, não de previsões reais.</div><label>Seu nome ou nome da equipe</label><input class="field" id="player" maxlength="60" value="${esc(s.name)}" placeholder="Ex.: Equipe Azul"><label>Nome da barbearia</label><input class="field" id="shop" maxlength="60" value="${esc(s.shop)}" placeholder="Ex.: Barbearia Central"><button class="btn green" onclick="start()">Começar minha empresa →</button></section>`}
function start(){let n=document.getElementById('player').value.trim(),shop=document.getElementById('shop').value.trim();if(!n||!shop){alert('Preencha seu nome e o nome da barbearia.');return}s.name=n;s.shop=shop;s.stage=1;save();setPage('build')}
function renderBuild(){let c=cost(),l=places[s.loc];return `<section class="card"><h2>01 • Monte sua barbearia</h2><p class="muted">Nada vem selecionado. Você pode revisar a montagem antes de inaugurar. Ao confirmar a inauguração, o imóvel e todas as compras iniciais serão definitivos. São necessários pelo menos dois meses de despesas fixas em caixa.</p><h3>Escolha o imóvel</h3><div class="grid">${places.map((p,i)=>option(p.name,`${p.desc}<br>Até ${p.max} cadeiras • Aluguel ${money(p.rent)}/mês • Caução ${money(p.deposit)} • Reforma ${money(p.reno)}`,s.loc===i,`chooseLoc(${i})`)).join('')}</div>${l?`<div class="section"><label>Quantidade de cadeiras: <strong>${s.n||'não escolhida'}</strong></label><input class="field" type="range" min="2" max="${l.max}" value="${s.n||2}" oninput="setN(this.value)"><p class="muted small">Imóvel comporta até ${l.max}. Cadeiras não geram receita sem profissionais.</p></div>`:''}${Object.entries(catalog).map(([k,v])=>`<section class="section"><h3>${v.label} ${v.per?'<span class="muted small">(por cadeira)</span>':''}</h3><div class="grid">${v.opts.map((o,i)=>option(o[0],`${money(o[1])}${v.per?' por cadeira':''} • Modelo ${i+1}`,s.sel[k]===i,`sel('${k}',${i})`)).join('')}</div>${k==='wash'?`<label style="margin-top:12px">Quantidade de lavatórios</label><select class="field" onchange="s.washN=Number(this.value);save();render()">${[1,2,3].map(n=>`<option ${s.washN===n?'selected':''}>${n}</option>`).join('')}</select>`:''}</section>`).join('')}<div class="section"><h3>Itens obrigatórios automáticos</h3><p>Ferramentas: R$ 1.500 por cadeira • Estoque: R$ 3.000 • Legalização: R$ 3.000 • Apoio: R$ 1.500 • Climatização: ${l?money(l.ac):'conforme imóvel'}.</p><div class="${c?.valid?'ok':'warn'}">${c?`Investimento: <b>${money(c.total)}</b> • Caixa: <b>${money(c.cash)}</b> • Reserva mínima: <b>${money(c.reserve)}</b><br>${c.valid?'Montagem viável. Agora escolha o preço e a equipe.':'Faltam escolhas ou a reserva está insuficiente.'}`:'Selecione o imóvel para começar.'}</div><button class="btn green" ${!c?.valid?'disabled':''} onclick="s.stage=2;save();setPage('team')">Continuar para equipe e preço →</button></div></section>`}
function renderTeam(){let c=cost(),h=s.initialStaff.reduce((a,n,i)=>a+n*staffTypes[i].hire,0);return `<section class="card"><h2>02 • Preço e equipe inicial</h2><p>Você instalou ${s.n} cadeiras. Quantos profissionais vão produzir no primeiro mês? Uma cadeira vazia não fatura.</p><h3>Preço do corte</h3><div class="grid">${[35,45,55,65,80,100,120].map(p=>option(money(p),'Preço por atendimento',s.price===p,`s.price=${p};save();render()`)).join('')}</div><h3>Contrate a equipe</h3>${staffTypes.map((t,i)=>`<div class="card"><div class="row"><div><b>${t.name}</b><p class="small muted">Comissão ${round(t.commission*100)}% • Até ${t.capacity} atendimentos/mês • Contratação ${money(t.hire)}</p></div><div class="row"><button class="btn alt" onclick="changeStaff(${i},-1)">−</button><b>${s.initialStaff[i]}</b><button class="btn alt" onclick="changeStaff(${i},1)">+</button></div></div></div>`).join('')}<div class="${c.cash-h>=c.reserve?'ok':'bad'}">Equipe: <b>${initialStaffCount()}</b> de ${s.n} cadeiras • Custo de contratação: ${money(h)} • Caixa após contratar: <b>${money(c.cash-h)}</b> • Reserva mínima: ${money(c.reserve)}</div><div class="actions"><button class="btn alt" onclick="setPage('build')">← Ajustar montagem</button><button class="btn green" ${s.price==null||initialStaffCount()<1||c.cash-h<c.reserve?'disabled':''} onclick="initOperation()">Inaugurar minha barbearia →</button></div></section>`}
function approve(action,amount=0,detail=''){return confirm('CONFIRMAR DECISÃO\n\n'+action+(amount?'\nInvestimento: '+money(amount):'')+(detail?'\n'+detail:'')+'\n\nApós confirmar, esta decisão será registrada e não poderá ser desfeita. Deseja continuar?')}
function note(txt){s.log.push(`Mês ${s.month}: ${txt}`)}function charge(amount,txt){if(s.cash<amount){alert('Caixa insuficiente para '+txt+'. Você precisa escolher outra opção ou buscar crédito no painel financeiro.');return false}s.cash-=amount;note(txt+' — '+money(amount));return true}
function pendingHire(t,delay){s.pendingHires.push({type:t,arrive:s.month+delay});note('Contratação agendada para o mês '+(s.month+delay))}
function applyEvent(m,idx){let e=eventFor(m);if(!e||s.eventDone[m]!=null)return;let [label,desc,cost,id]=e.options[idx];if(!approve('Carta '+e.title+': '+label,cost,desc+'\nA resposta desta carta ficará definitiva.'))return;if(!charge(cost,label))return;s.eventDone[m]=idx;note('Carta '+e.title+': '+label);if(id.startsWith('quit')){let type=s.staff[1]?1:s.staff[0]?0:s.staff[2]?2:-1;if(type>=0){s.staff[type]--;note('Um profissional saiu; cadeira ficou vazia.')}if(id==='quitFast')pendingHire(1,1);if(id==='quitSlow')pendingHire(0,2);if(id==='quitWait')pendingHire(0,4)}if(id==='waitSoftware'){s.software=1;s.retention+=.025}if(id==='waitTrain'||id==='commissionTrain'||id==='retTrain'){s.training=1;s.retention+=.025}if(id==='waitNone'&&s.history.at(-1)?.occupancy>.85)s.reputation-=6;if(id==='expandMarketing'||id==='growthCampaign'||id==='marketingBoost')s.eventEffects.campaignUntil=m+(id==='growthCampaign'?3:1);if(id==='expandLoyal'||id==='growthRetention'||id==='retLoyal'||id==='finalLoyal')s.retention+=.035;if(id==='competitorExperience'||id==='competitorLoyal'||id==='priceDiffer'||id==='priceLoyal')s.eventEffects.protectionUntil=m+6;if(id==='competitorLoyal'||id==='priceLoyal')s.retention+=.015;if(id==='competitorNone')s.eventEffects.competitorUntil=m+6;if(id==='rentAccept')s.eventEffects.rentMult=1.12;if(id==='rentNegotiate')s.eventEffects.rentMult=1.06;if(id==='rentDelay'){s.eventEffects.rentDelay=16}if(id==='commissionYes')s.eventEffects.commissionExtra=(s.eventEffects.commissionExtra||0)+.02;if(id==='commissionNo'){s.eventEffects.riskQuit=16}if(id==='marketingReview')s.eventEffects.marketingBoostUntil=m+6;if(id==='marketingPause')s.marketing=0;if(id==='retNone')s.reputation-=5;if(id==='trendFast')s.eventEffects.fast=true;if(id==='trendExperience'){s.retention+=.04;s.eventEffects.extras=true}if(id==='trendResearch')s.reputation+=3;if(id==='staffKeep')s.eventEffects.commissionExtra=(s.eventEffects.commissionExtra||0)+.01;if(id==='staffReplace'||id==='staffLeave'){let t=s.staff[1]?1:s.staff[2]?2:s.staff[0]?0:-1;if(t>=0){s.staff[t]--;pendingHire(id==='staffReplace'?1:0,id==='staffReplace'?1:3)}}if(id==='modernSoftware'){s.software=2;s.retention+=.025}if(id==='modernExperience'){s.retention+=.03;s.reputation+=4}if(id==='priceNone')s.eventEffects.competitorUntil=m+4;if(id==='finalExpand')s.eventEffects.campaignUntil=m+3;s.reputation=clamp(s.reputation,0,100);save();render()}
function eventPanel(){let e=eventFor(s.month);if(!e||s.eventDone[s.month]!=null)return '';return `<div class="event"><span class="tag">CARTA • MÊS ${s.month}</span><h2>${e.title}</h2><p>${e.desc}</p><p class="small muted">Escolha uma resposta para fechar este mês. Os efeitos podem continuar nos meses seguintes.</p>${e.options.map((o,i)=>option(o[0],`${o[1]} ${o[2]?'• Desembolso '+money(o[2]):''}`,false,`applyEvent(${s.month},${i})`)).join('')}</div>`}
function operationalFixed(){let l=places[s.loc];let rent=l.rent*(s.eventEffects.rentMult||1);if(s.eventEffects.rentDelay&&s.month>=s.eventEffects.rentDelay){rent=l.rent*1.15;s.eventEffects.rentMult=1.15;delete s.eventEffects.rentDelay}return rent+3000+(s.software? s.software===1?200:500:0)}
function preview(){let l=places[s.loc],ex=experience(),fit=priceFit(),n=staffCount(),cap=capacity()*(s.eventEffects.fast?1.08:1),ramp=clamp(.35+s.month*.065,.4,1),reputationFactor=clamp(.72+s.reputation/180,.75,1.28),loyalFactor=1+clamp(s.retention,0,.25)+clamp(s.loyal/1000,0,.22),marketingLead=s.marketing?Math.round(s.marketing/35*l.traffic*(s.eventEffects.marketingBoostUntil>=s.month?1.3:1)*(s.eventEffects.campaignUntil>=s.month?1.5:1)*deterministic(s.month)):0;let base=(l.base*ramp+marketingLead+s.loyal*.15)*fit.ratio*fit.mismatch*reputationFactor*loyalFactor;let competitor=s.eventEffects.competitorUntil>=s.month? .84:1;let potential=Math.max(0,round(base*competitor));let staffQuality=avgQuality();let conversion=clamp(.85+staffQuality*.13+(ex.score-1)*.10,.67,1.15);let interested=round(potential*conversion);let attended=Math.max(0,Math.min(interested,round(cap)));let lost=Math.max(0,interested-attended);let commission=s.staff.reduce((a,n,i)=>a+n*staffTypes[i].commission,0)/(staffCount()||1)+(s.eventEffects.commissionExtra||0);let serviceRevenue=attended*s.price;let extrasRate=clamp(.055+(ex.score-1)*.035+(s.eventEffects.extras?.025:0)+(s.washCount>1?.01:0),.025,.14);let extras=round(serviceRevenue*extrasRate);let products=round(serviceRevenue*clamp(.018+(s.training?.008:0),.01,.05));let revenue=serviceRevenue+extras+products;let variable=round(revenue*(commission+.06));let fixed=operationalFixed();let profit=round(revenue-variable-fixed-s.marketing);let occupancy=cap?attended/cap:0;return {potential,interested,attended,lost,cap,revenue,serviceRevenue,extras,products,variable,fixed,profit,occupancy,marketingLead,fit,ex,commission}}
function actions(){return `<div class="section"><h3>Suas decisões deste mês</h3><p class="small muted">Antes de cada compra ou mudança, confira o resumo e confirme. Compras, contratações, cartas e reajustes confirmados não podem ser desfeitos. Marketing e software podem ser redefinidos somente em meses futuros.</p><div class="grid"><div class="card"><h3>📣 Marketing mensal</h3><p class="small muted">Gera procura, mas pode ser desperdiçado se faltar capacidade. Desempenho varia por mês.</p><select class="field" onchange="changeMarketing(this.value)">${[0,500,1500,3000,5000].map(v=>`<option value="${v}" ${s.marketing===v?'selected':''}>${money(v)}/mês</option>`).join('')}</select></div><div class="card"><h3>💻 Software</h3><p class="small muted">Mensalidade aumenta despesas, mas melhora retenção e agendamento.</p><select class="field" onchange="changeSoftware(this.value)">${[[0,'Sem software'],[1,'Agenda — R$ 200/mês'],[2,'Relacionamento — R$ 500/mês']].map(([v,n])=>`<option value="${v}" ${s.software===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><h3>🏷️ Preço do corte</h3><p class="small muted">Mudanças entram em vigor no próximo mês e podem afetar demanda.</p><select class="field" ${s.nextPrice!=null?'disabled':''} onchange="changePrice(this.value)"><option value="">${s.nextPrice!=null?'Reajuste confirmado: '+money(s.nextPrice):'Manter '+money(s.price)}</option>${[35,45,55,65,80,100,120].filter(p=>p!==s.price).map(p=>`<option value="${p}" ${s.nextPrice===p?'selected':''}>Alterar para ${money(p)}</option>`).join('')}</select></div><div class="card"><h3>👥 Equipe</h3><p>${staffCount()} profissionais / ${s.chairs} cadeiras.</p><label>Contratar profissional</label><select id="hireType" class="field">${staffTypes.map((t,i)=>`<option value="${i}">${t.name} — ${money(t.hire)}</option>`).join('')}</select><button class="btn alt" onclick="hire()">Contratar (chega mês seguinte)</button><button class="btn alt" style="margin-top:8px" ${s.training?'disabled':''} onclick="train()">${s.training?'Treinamento realizado ✓':'Treinar equipe • R$ 2.000'}</button></div><div class="card"><h3>🪑 Expandir</h3><p class="small muted">Capacidade física: ${s.chairs}/${places[s.loc].max} cadeiras. Nova cadeira inclui ferramentas e instalação.</p><button class="btn alt" ${s.chairs>=places[s.loc].max?'disabled':''} onclick="expand()">Adicionar cadeira • ${money(catalog.chair.opts[s.levels.chair][1]+catalog.bench.opts[s.levels.bench][1]+catalog.mirror.opts[s.levels.mirror][1]+1500)}</button></div><div class="card"><h3>❄️ Climatização</h3><p class="small muted">Melhore o conforto conforme a empresa cresce.</p><button class="btn alt" ${s.acExtra>=2?'disabled':''} onclick="upgradeAC()">Adicionar módulo • R$ 4.500</button><p class="small muted">Módulos adicionais: ${s.acExtra}</p></div></div><h3>Melhorar os equipamentos</h3><div class="grid">${Object.entries(catalog).map(([k,v])=>`<div class="card"><b>${v.label}</b><p class="small muted">Atual: ${v.opts[s.levels[k]][0]} ${v.per?'• '+s.chairs+' unidades':''}</p><select class="field" id="up_${k}"><option value="">Escolha um modelo</option>${v.opts.map((o,i)=>`<option value="${i}" ${i<=s.levels[k]?'disabled':''}>${o[0]} • ${money(Math.max(0,o[1]-v.opts[s.levels[k]][1])*(v.per?s.chairs:k==='wash'?s.washCount:1))}</option>`).join('')}</select><button class="btn alt" onclick="upgrade('${k}')">Melhorar</button></div>`).join('')}</div><div class="card"><h3>🚿 Lavatório extra</h3><p>${s.washCount} instalado(s). Ajuda a absorver serviços extras.</p><button class="btn alt" ${s.washCount>=3?'disabled':''} onclick="extraWash()">Comprar outro • ${money(catalog.wash.opts[s.levels.wash][1])}</button></div></div>`}
function changeMarketing(value){let n=Number(value);if(n===s.marketing)return;if(!approve('Definir marketing mensal em '+money(n),0,'A nova verba vale para este mês. Poderá definir outra verba apenas em meses futuros.')){render();return}s.marketing=n;note('Marketing mensal definido em '+money(n));save();render()}
function changeSoftware(value){let n=Number(value);if(n===s.software)return;if(!approve('Definir software: '+(n===0?'sem software':n===1?'Agenda':'Relacionamento'),0,'A escolha vale neste mês; uma mudança futura exigirá nova decisão.')){render();return}s.software=n;note('Software alterado para '+n);save();render()}
function changePrice(value){if(value===''){render();return}let n=Number(value);if(s.nextPrice!=null){alert('Você já confirmou um reajuste para o próximo mês. Não é possível cancelar ou trocar esta decisão agora.');render();return}if(!approve('Reajustar preço do corte para '+money(n),0,'O preço entrará em vigor no próximo mês. Não é possível cancelar o reajuste depois de confirmado.')){render();return}s.nextPrice=n;note('Reajuste de preço agendado para '+money(n));save();render()}
function hire(){if(staffCount()+s.pendingHires.length>=s.chairs){alert('Não há cadeira disponível para mais um profissional.');return}let i=Number(document.getElementById('hireType').value);if(!approve('Contratar '+staffTypes[i].name,staffTypes[i].hire,'O profissional chega no próximo mês; a contratação não pode ser cancelada.'))return;if(!charge(staffTypes[i].hire,'Recrutamento'))return;pendingHire(i,1);save();render()}function train(){if(s.training){alert('O treinamento já foi realizado nesta partida.');return}if(!approve('Treinar equipe',2000,'O investimento é definitivo.'))return;if(!charge(2000,'Treinamento'))return;s.training=1;s.retention=clamp(s.retention+.018,0,.25);save();render()}function expand(){if(s.chairs>=places[s.loc].max)return;let n=catalog.chair.opts[s.levels.chair][1]+catalog.bench.opts[s.levels.bench][1]+catalog.mirror.opts[s.levels.mirror][1]+1500;if(!approve('Comprar e instalar mais uma cadeira',n,'A cadeira será adicionada permanentemente; não há opção de devolução.'))return;if(!charge(n,'Compra de cadeira e posto completo'))return;s.chairs++;note('Nova cadeira instalada; precisa de profissional para faturar');save();render()}function upgradeAC(){if(s.acExtra>=2)return;if(!approve('Comprar módulo adicional de climatização',4500,'A instalação é definitiva.'))return;if(!charge(4500,'Climatização adicional'))return;s.acExtra++;save();render()}function extraWash(){if(s.washCount>=3)return;let n=catalog.wash.opts[s.levels.wash][1];if(!approve('Comprar lavatório adicional',n,'A compra é definitiva.'))return;if(!charge(n,'Lavatório adicional'))return;s.washCount++;save();render()}function upgrade(k){let el=document.getElementById('up_'+k),idx=Number(el.value);if(el.value===''||idx<=s.levels[k]){alert('Escolha um modelo superior.');return}let v=catalog[k],count=v.per?s.chairs:k==='wash'?s.washCount:1,amount=(v.opts[idx][1]-v.opts[s.levels[k]][1])*count;if(!approve('Substituir '+v.label+' por '+v.opts[idx][0],amount,'O modelo anterior será substituído definitivamente.'))return;if(!charge(amount,'Melhoria de '+v.label))return;s.levels[k]=idx;note('Melhoria de '+v.label+' instalada');save();render()}
function loan(){if(s.borrowed){alert('O crédito já foi utilizado.');return}if(!approve('Contratar crédito de R$ 10.000',0,'Obrigação de pagar R$ 12.000 no mês 36. Não é faturamento e não pode ser cancelado.'))return;s.cash+=10000;s.debt+=12000;s.borrowed=true;note('Crédito de R$ 10.000; obrigação de pagar R$ 12.000 no mês 36');save();render()}function aport(){if(s.aporte){alert('O aporte já foi utilizado.');return}if(!approve('Realizar aporte dos sócios de R$ 10.000',0,'Não é faturamento. A decisão é definitiva.'))return;s.cash+=10000;s.aporte=true;note('Aporte dos sócios de R$ 10.000 (não é faturamento)');save();render()}
function closeMonth(){let ev=eventFor(s.month);if(ev&&s.eventDone[s.month]==null){alert('Responda à carta deste mês antes de fechar.');return}let p=preview();if(s.cash+p.profit<0){alert('O caixa ficará negativo. Use o crédito ou aporte no painel financeiro, ou reduza marketing antes de fechar.');return}if(!approve('Fechar definitivamente o mês '+s.month,0,'Faturamento: '+money(p.revenue)+' | Resultado: '+money(p.profit)+' | Caixa final: '+money(s.cash+p.profit)+'\nNão será possível voltar a este mês nem alterar suas decisões.'))return;let oldCash=s.cash;s.cash+=p.profit;s.loyal=clamp(round(s.loyal*.75+p.attended*(.13+s.retention+(s.software? .03:0))*(p.ex.acComfort)),0,1200);let lostPressure=p.interested? p.lost/p.interested:0;let repChange=clamp(round((p.ex.score-1)*3+(avgQuality()-1)*5-(lostPressure>.12?5:0)+(s.software?1:0)), -7,4);s.reputation=clamp(s.reputation+repChange,15,100);let row={month:s.month,price:s.price,chairs:s.chairs,staff:staffCount(),marketing:s.marketing,clients:p.attended,demand:p.interested,lost:p.lost,capacity:round(p.cap),occupancy:p.occupancy,revenue:p.revenue,service:p.serviceRevenue,extras:p.extras,products:p.products,variable:p.variable,fixed:p.fixed,profit:p.profit,cash:s.cash,oldCash,reputation:s.reputation,experience:p.ex.score,marketingLeads:p.marketingLead,notes:[`Procura ${p.interested}, capacidade ${round(p.cap)}, atendidos ${p.attended}`,p.lost?`${p.lost} clientes perdidos por falta de capacidade`:'Capacidade suficiente',`Marketing ${money(s.marketing)} gerou ${p.marketingLead} contatos potenciais`,p.fit.mismatch<.98?'Estrutura reduziu aceitação do preço':'Estrutura compatível com o preço',repChange<0?'Reputação caiu '+Math.abs(repChange)+' pontos':'Reputação variou '+repChange+' pontos']};s.history.push(row);note(`Fechamento: faturamento ${money(p.revenue)}, resultado ${money(p.profit)}, caixa ${money(s.cash)}`);s.month++;if(s.month===16&&s.eventEffects.riskQuit){let i=s.staff[1]?1:s.staff[0]?0:s.staff[2]?2:-1;if(i>=0){s.staff[i]--;note('Profissional saiu após negociação malsucedida')}}let arrivals=s.pendingHires.filter(h=>h.arrive<=s.month);for(let h of arrivals){if(staffCount()<s.chairs){s.staff[h.type]++;note('Novo profissional entrou na equipe')}}s.pendingHires=s.pendingHires.filter(h=>h.arrive>s.month);if(s.nextPrice){s.price=s.nextPrice;note('Novo preço entrou em vigor: '+money(s.price));s.nextPrice=null}if(s.month===36&&s.eventEffects.rentDelay){s.eventEffects.rentMult=1.15}if(s.month>36){if(s.debt){s.cash-=s.debt;note('Pagamento do crédito no mês 36: '+money(s.debt));s.history.at(-1).cash=s.cash;s.debt=0}if(s.cash<0){alert('A dívida final deixou o caixa negativo. O relatório mostrará essa crise.')}s.ended=true;page='end'}save();render()}
function renderMonth(){let p=preview(),h=s.history.at(-1),e=eventFor(s.month);return `<section class="card"><div class="row"><div><span class="tag">ANO ${Math.ceil(s.month/12)} • MÊS ${s.month}/36</span><h2>${esc(s.shop)}</h2></div><button class="btn alt" onclick="exportReport()">Exportar ficha</button></div><div class="kpis"><div class="kpi"><small>Caixa atual</small><b>${money(s.cash)}</b></div><div class="kpi"><small>Faturamento previsto*</small><b>${money(p.revenue)}</b></div><div class="kpi"><small>Resultado previsto*</small><b>${money(p.profit)}</b></div><div class="kpi"><small>Profissionais / cadeiras</small><b>${staffCount()} / ${s.chairs}</b></div><div class="kpi"><small>Demanda / capacidade</small><b>${p.interested} / ${round(p.cap)}</b></div><div class="kpi"><small>Reputação</small><b>${s.reputation}/100</b></div></div><p class="small muted">*Prévia recalculada conforme as escolhas deste mês. O fechamento grava o resultado permanentemente.</p>${h?`<div class="ok"><b>Mês anterior:</b> ${money(h.revenue)} faturados, ${money(h.profit)} de resultado e ${h.lost} clientes perdidos por falta de capacidade.</div>`:''}<div class="panel"><h3>O que está acontecendo?</h3><p>Clientes interessados: <b>${p.interested}</b> • Atendimentos possíveis: <b>${round(p.cap)}</b> • Atendimentos previstos: <b>${p.attended}</b></p><div class="meter"><span style="width:${clamp(p.occupancy*100,0,100)}%"></span></div><p class="small muted">Ocupação prevista: ${round(p.occupancy*100)}%. ${p.lost?`Você poderá perder ${p.lost} clientes por falta de capacidade.`:'Há capacidade para a procura atual.'}</p><p class="small">Preço e experiência: ${p.fit.mismatch<.98?'estrutura abaixo da expectativa para o preço escolhido':p.fit.ratio<.95?'preço acima da faixa usual da região':'combinação sem penalidade relevante'}.</p></div>${eventPanel()}${actions()}<div class="panel"><h3>Fechamento previsto</h3><div class="scroll"><table><tr><td>Serviços</td><td>${money(p.serviceRevenue)}</td></tr><tr><td>Extras</td><td>${money(p.extras)}</td></tr><tr><td>Produtos</td><td>${money(p.products)}</td></tr><tr><th>Faturamento total</th><th>${money(p.revenue)}</th></tr><tr><td>Comissões e custos variáveis</td><td>−${money(p.variable)}</td></tr><tr><td>Fixos (aluguel, apoio, software)</td><td>−${money(p.fixed)}</td></tr><tr><td>Marketing</td><td>−${money(s.marketing)}</td></tr><tr><th>Resultado do mês</th><th>${money(p.profit)}</th></tr><tr><th>Caixa ao fechar</th><th>${money(s.cash+p.profit)}</th></tr></table></div>${e&&s.eventDone[s.month]==null?'<div class="warn">Responda à carta acima para fechar este mês.</div>':''}<button class="btn green" ${e&&s.eventDone[s.month]==null?'disabled':''} onclick="closeMonth()">Fechar mês ${s.month} e avançar →</button></div>${s.history.length?`<div class="panel"><h3>Trajetória do faturamento</h3>${chart(s.history.map(x=>x.revenue))}<p class="small muted">Cada barra é um mês já encerrado.</p></div>`:''}</section>`}
function chart(vals){let max=Math.max(1,...vals);return `<div class="chart">${vals.map((v,i)=>`<div title="Mês ${i+1}: ${money(v)}" style="height:${Math.max(2,round(v/max*100))}%"></div>`).join('')}</div>`}
function renderEnd(){let revenue=s.history.reduce((a,r)=>a+r.revenue,0),profit=s.history.reduce((a,r)=>a+r.profit,0),lost=s.history.reduce((a,r)=>a+r.lost,0),year=y=>s.history.filter(r=>Math.ceil(r.month/12)===y);return `<section class="card"><span class="tag">36 MESES CONCLUÍDOS</span><h2>O resultado da ${esc(s.shop)}</h2><div class="kpis"><div class="kpi"><small>Faturamento acumulado</small><b>${money(revenue)}</b></div><div class="kpi"><small>Resultado operacional</small><b>${money(profit)}</b></div><div class="kpi"><small>Caixa final</small><b>${money(s.cash)}</b></div><div class="kpi"><small>Clientes não atendidos</small><b>${lost}</b></div></div><h3>Faturamento por ano</h3><div class="scroll"><table><tr><th>Ano</th><th>Faturamento</th><th>Resultado</th><th>Caixa no encerramento</th></tr>${[1,2,3].map(y=>{let a=year(y);return `<tr><td>${y}</td><td>${money(a.reduce((x,r)=>x+r.revenue,0))}</td><td>${money(a.reduce((x,r)=>x+r.profit,0))}</td><td>${money(a.at(-1)?.cash||0)}</td></tr>`}).join('')}</table></div><h3>Trajetória mensal</h3>${chart(s.history.map(x=>x.revenue))}<p>Você terminou com ${s.chairs} cadeiras instaladas e ${staffCount()} profissionais. Reputação final: ${s.reputation}/100.</p><div class="actions"><button class="btn green" onclick="exportReport()">Baixar relatório completo (.txt)</button><button class="btn alt" onclick="copyReport()">Copiar resumo</button></div><div class="warn">O relatório registra o que aconteceu. A análise pedagógica de decisões alternativas será desenvolvida separadamente.</div></section>`}
function report(){let rows=s.history.map(r=>[r.month,r.price,r.chairs,r.staff,r.marketing,r.clients,r.demand,r.lost,r.revenue,r.variable,r.fixed,r.profit,r.cash,r.reputation].join(';'));return ['DO ZERO AO FUTURO 2.0','Equipe: '+s.name,'Barbearia: '+s.shop,'Imóvel: '+(places[s.loc]?.name||''),'Capital inicial: R$ 100.000','Caixa atual: '+money(s.cash),'Mês atual: '+s.month,'','HISTÓRICO DE DECISÕES',...s.log,'','MÊS;PREÇO;CADEIRAS;PROFISSIONAIS;MARKETING;CLIENTES;DEMANDA;PERDIDOS;FATURAMENTO;VARIÁVEIS;FIXOS;RESULTADO;CAIXA;REPUTAÇÃO',...rows,'','Simulação fictícia para aprendizagem.'].join('\n')}
function exportReport(){let blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio-barbearia-'+s.month+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function copyReport(){navigator.clipboard?.writeText(report()).then(()=>alert('Relatório copiado.')).catch(()=>alert('Use o botão Baixar relatório.'))}
function restart(){if(!confirm('Apagar esta partida salva neste aparelho? Esta ação não pode ser desfeita. Exporte o relatório antes.'))return;localStorage.removeItem(KEY);s=defaultState();page='intro';render()}
function renderSide(){let c=cost();return `<div class="panel"><span class="tag">PAINEL DA EMPRESA</span><h3>${esc(s.shop||'Sua barbearia')}</h3><p class="small muted">${esc(s.name||'Jogador')}</p><div class="kpis"><div class="kpi"><small>Caixa</small><b>${money(s.locked?s.cash:c?c.cash:100000)}</b></div><div class="kpi"><small>Etapa</small><b>${s.locked?'Mês '+Math.min(36,s.month):'Abertura'}</b></div></div>${s.locked?`<p class="small">${s.chairs} cadeiras • ${staffCount()} profissionais • Corte ${money(s.price)}</p><p class="small">Marketing ${money(s.marketing)}/mês • Aluguel ${money(places[s.loc].rent*(s.eventEffects.rentMult||1))}</p><div class="section"><h4>Crise de caixa</h4><p class="small muted">Recursos opcionais, uma vez cada. Aporte não é lucro; crédito exige pagamento no mês 36.</p><button class="btn alt" ${s.aporte?'disabled':''} onclick="aport()">Aporte +R$ 10 mil</button><button class="btn alt" style="margin-top:8px" ${s.borrowed?'disabled':''} onclick="loan()">Crédito +R$ 10 mil</button><p class="small muted">Dívida a pagar: ${money(s.debt)}</p></div>`:`<p class="small">Investimento: ${money(c?.total||0)}<br>Reserva mínima: ${money(c?.reserve||0)}</p>`}<div class="section"><button class="btn alt" onclick="exportReport()">Exportar progresso</button><button class="btn red" style="margin-top:8px" onclick="restart()">Reiniciar partida</button></div><p class="small muted">Salvamento automático no navegador. Não troque de aparelho nem use aba anônima durante a partida.</p></div>`}
function render(){document.getElementById('nav').innerHTML=[['intro','Início'],['build','Montagem'],['team','Equipe e preço'],['month','Gestão • 36 meses'],['end','Relatório']].map(([p,n],i)=>`<button class="${page===p?'active':''}" ${i>s.stage||p==='end'&&!s.ended||s.locked&&i<3?'disabled':''} onclick="setPage('${p}')">${n}</button>`).join('');document.getElementById('app').innerHTML=page==='intro'?renderIntro():page==='build'?renderBuild():page==='team'?renderTeam():page==='end'?renderEnd():renderMonth();document.getElementById('side').innerHTML=renderSide()}
render();
</script></body></html>
