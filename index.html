const actions=[{id:'ads',name:'Tráfego pago local',cost:2000,desc:'Aumenta procura gradualmente; não cria capacidade.',months:[1,3,7,10,15,19,23,27,31,34]},{id:'bigads',name:'Campanha intensiva',cost:5000,desc:'Campanha de maior alcance por alguns meses.',months:[4,11,17,25,32]},{id:'train',name:'Treinar profissional',cost:2500,desc:'Evolui um barbeiro; intervalo mínimo de seis meses.',months:[6,12,18,24,30,35]},{id:'mentor',name:'Mentoria de gestão',cost:8000,desc:'Melhora processos e conversão gradualmente; sem bônus garantido.',months:[9,21]},{id:'insurance',name:'Seguro anual completo',cost:6000,desc:'Cobertura simulada para assalto com franquia; duração de 12 meses.',months:[12,24]},{id:'facade',name:'Melhorar fachada',cost:6000,desc:'Eleva adequação e reputação, sem faturamento automático.',months:[8,20,29]},{id:'maintenance',name:'Manutenção preventiva',cost:2500,desc:'Reduz desgaste e recupera conforto.',months:[6,14,24,30]},{id:'station',name:'Instalar posto completo',cost:0,desc:'Compra cadeira, bancada e espelho conforme sua escolha inicial.',months:[10,18,21,28,33]},{id:'hire',name:'Contratar barbeiro normalmente',cost:0,desc:'Sem taxa de admissão; comissão mensal de 40% a 46% sobre serviços e custo de operação. Não é profissional gratuito.',months:[6,9,12,15,18,21,24,27,30,33,35]},{id:'price',name:'Revisar preço',cost:0,desc:'Corrige posicionamento; pode perder clientes se subir demais.',months:[3,6,9,12,15,18,21,24,27,30,33,35]},{id:'referral',name:'Campanha de indicação',cost:450,desc:'Ação de baixo alcance e sem desembolso inicial.',months:[2,5,8,11,14,17,20,23,26,29,32,35]},{id:'agenda',name:'Reorganizar agenda',cost:650,desc:'Melhora aproveitamento sem criar demanda.',months:[1,4,7,10,13,16,19,22,25,28,31,34]},{id:'cost',name:'Auditoria de desperdícios',cost:900,desc:'Reduz despesas controláveis de modo limitado.',months:[2,6,10,14,18,22,26,30,34]},{id:'rent',name:'Assessoria para renegociar aluguel',cost:1200,desc:'Redução temporária com pagamento futuro; sem perdão de dívida.',months:[9,18,27]},{id:'rebuild',name:'Reconstruir posto danificado',cost:0,desc:'Repõe uma cadeira, bancada e espelho; custo real.',months:[]}];
const events={3:['Primeiros clientes','O movimento inicial revela horários ociosos.'],6:['Ar-condicionado quebrado','O equipamento parou. Reparo custa R$ 2.500; adiar prejudica conforto.'],9:['Gestão sob pressão','Você percebe falhas de agenda, vendas e treinamento.'],12:['Proteção do patrimônio','É hora de decidir sobre seguro para os próximos 12 meses.'],15:['Risco patrimonial','Uma invasão pode atingir a estrutura; seguro muda o prejuízo.'],18:['Saída de profissional','Um barbeiro pode deixar a equipe. Contratação é normal e gera custos mensais.'],21:['Oportunidade de expansão','A demanda pode justificar um novo posto, mas cadeira vazia não fatura.'],24:['Estrutura envelhecendo','Conservação e renovação do seguro exigem caixa.'],27:['Concorrente na região','Um novo concorrente pressiona sua demanda.'],30:['Reajuste do aluguel','O contrato sofreu reajuste. Reveja margem e custos.'],33:['Proposta ao melhor barbeiro','Seu profissional recebeu uma oferta. Decida como reagir.']};
const S={stage:0,month:0,cash:100000,point:null,qty:0,choices:{},barbers:[],price:null,marketing:null,actionsUsed:0,used:{},history:[],log:[],reputation:55,demandBonus:0,process:0,training:0,insuranceUntil:0,damaged:0,closed:0,rentDiscount:0,rentDebt:0,ownerDebt:0,profit:0,revenue:0,robbed:false,event:null,eventHandled:false,ready:false};
function note(t){S.log.unshift('M'+S.month+' — '+t);S.log=S.log.slice(0,100)}function point(){return points[S.point]}function stationCost(){return ['chair','bench','mirror'].reduce((v,k)=>v+catalog[k][S.choices[k]??0][1],0)}function setupTotal(){if(S.point===null)return 0;return point()[1]*3+point()[2]+S.qty*['chair','bench','mirror'].reduce((v,k)=>v+(S.choices[k]===undefined?0:catalog[k][S.choices[k]][1]),0)+['waiting','reception','coffee','facade'].reduce((v,k)=>v+(S.choices[k]===undefined?0:catalog[k][S.choices[k]][1]),0)}function setupBalance(){return 100000-setupTotal()}function confirmChoice(k,i){const delta=(catalog[k][i][1]-(S.choices[k]===undefined?0:catalog[k][S.choices[k]][1]))*(['chair','bench','mirror'].includes(k)?S.qty:1);if(setupBalance()<delta){alert('Saldo insuficiente para esta compra.');return}if(!confirm('Confirmar esta escolha? Depois não será possível voltar.'))return;S.choices[k]=i;S.cash=setupBalance();S.stage++;render()}function choosePoint(i){if(100000<points[i][1]*3+points[i][2]){alert('Capital insuficiente.');return}if(!confirm('Confirmar imóvel e pagar caução + reforma? Esta escolha é definitiva.'))return;S.point=i;S.cash=setupBalance();S.stage=1;render()}function chooseQty(n){if(n*1700>setupBalance()){alert('Caixa insuficiente para os postos básicos.');return}if(!confirm('Confirmar '+n+' postos? A quantidade inicial será definitiva.'))return;S.qty=n;S.cash=setupBalance();S.stage=2;render()}function startTeam(){if(S.barbers.length<1){alert('Contrate pelo menos um barbeiro.');return}if(!confirm('Confirmar equipe inicial?'))return;S.stage=10;render()}function hire(skill){if(S.barbers.length>=S.qty-S.damaged){alert('Não há posto ativo disponível.');return false}if(skill===2&&(S.month<6||S.reputation<70)){alert('Expert exige mês 6, reputação 70 e caixa suficiente.');return false}if(S.month===0&&skill===1&&S.barbers.some(b=>b.skill===1)){alert('Apenas um intermediário na abertura.');return false}S.barbers.push({skill,name:'Barbeiro '+(S.barbers.length+1),commission:skill===0?.40:skill===1?.43:.46});note('Contratou profissional '+['iniciante','intermediário','expert'][skill]+'.');render();return true}function pricePick(v){if(!confirm('Confirmar corte por '+money(v)+'?'))return;S.price=v;S.stage=11;render()}function marketingPick(i){let costs=[300,600,2000,5000];if(S.cash<costs[i])return; if(!confirm('Confirmar marketing de '+money(costs[i])+'?'))return;S.marketing=i;S.cash-=costs[i];S.demandBonus+=i===0?10:i===1?18:i===2?40:55;S.stage=12;S.ready=true;note('Inauguração preparada. Marketing: '+money(costs[i]));render()}
function eventStart(){S.event=null;S.eventHandled=false;const m=S.month;if(m===6)S.event='ac';if(m===15&&!S.robbed){S.robbed=true;S.event='robbery';if(S.insuranceUntil>=m){S.cash-=2000;S.closed=1;note('Assalto coberto: franquia R$ 2.000 e interrupção parcial.')}else{let loss=Math.max(1,Math.ceil(S.qty*.5));S.damaged=Math.min(S.qty,loss);S.cash-=3500;S.closed=2;note('Assalto sem seguro: '+S.damaged+' postos danificados, R$ 3.500 de reparos e atendimento reduzido.')}}if(m===18&&S.barbers.length>1){S.barbers.pop();S.event='departure';note('Um barbeiro saiu da equipe.')}if(m===27){S.demandBonus-=28;S.event='competition';note('Concorrente abriu na região.')}if(m===30){S.event='rent';note('Reajuste contratual de 7% no aluguel.')}if(m===33){S.event='offer';note('Seu melhor barbeiro recebeu uma proposta.')}}
function actionMenu(){return actions.filter(a=>a.months.includes(S.month)||(a.id==='hire'&&S.barbers.length<S.qty-S.damaged)||(a.id==='rebuild'&&S.damaged>0)||(a.id==='price'&&S.month%3===0)||(a.id==='insurance'&&S.month>=12&&S.insuranceUntil<S.month&&S.month%3===0))}function actionCost(a){return a.id==='station'?stationCost():a.id==='rebuild'?stationCost():a.cost}function eligible(a){if(S.used[a.id]===S.month)return false;if(a.id==='train'&&S.month-(S.used.train||-100)<6)return false;if(a.id==='mentor'&&S.month-(S.used.mentor||-100)<12)return false;if(a.id==='station'&&S.cash<stationCost())return false;if(a.id==='hire'&&S.barbers.length>=S.qty-S.damaged)return false;if(a.id==='insurance'&&S.insuranceUntil>=S.month)return false;if(a.id==='rebuild'&&S.damaged===0)return false;if(a.id==='facade'&&S.choices.facade===3)return false;return true}function take(id){if(S.actionsUsed>=5)return;const a=actions.find(x=>x.id===id);if(!a||!actionMenu().some(x=>x.id===id)||!eligible(a))return;const cost=actionCost(a);if(cost>S.cash){alert('Caixa insuficiente. Investimentos voluntários não são financiados automaticamente.');return}if(!confirm(a.name+' — '+money(cost)+'? A decisão será definitiva.'))return;let success=true;if(id==='hire'){let skill=S.point===4&&S.month>=6&&S.reputation>=70?2:1;success=hire(skill);if(!success)return}else if(id==='price'){let value=Number(prompt('Novo preço: 20, 45, 75 ou 100',S.price));if(![20,45,75,100].includes(value))return;S.price=value;note('Novo preço: '+money(value))}else{S.cash-=cost;switch(id){case'ads':S.demandBonus+=22;break;case'bigads':S.demandBonus+=42;break;case'train':{let b=S.barbers.find(b=>b.skill<2);if(!b){S.cash+=cost;alert('Equipe já está no nível máximo.');return}b.skill++;S.training++;break}case'mentor':S.process+=.065;S.demandBonus+=12;break;case'insurance':S.insuranceUntil=S.month+11;break;case'facade':S.choices.facade++;S.reputation+=3;break;case'maintenance':S.reputation+=2;break;case'station':S.qty++;break;case'referral':S.demandBonus+=9;break;case'agenda':S.process=Math.min(.22,S.process+.012);break;case'cost':S.process=Math.min(.22,S.process+.015);break;case'rent':S.rentDiscount=3;S.rentDebt+=point()[1]*.12*3;break;case'rebuild':S.damaged--;break;}note(a.name+' realizado'+(cost?' por '+money(cost):'')+'.')}S.actionsUsed++;S.used[id]=S.month;render()}
function resolveEvent(choice){if(S.eventHandled)return;const e=S.event;if(e==='ac'){if(choice===0){if(S.cash<2500){alert('Sem caixa para o conserto. Escolha adiar.');return}S.cash-=2500}else{S.reputation-=5;S.closed=1}}else if(e==='offer'){if(choice===0){if(S.cash<3000){alert('Sem caixa. Escolha outra opção.');return}S.cash-=3000;S.reputation+=2}else if(choice===1){S.reputation-=2}else if(S.barbers.length>1){S.barbers.pop()}}S.eventHandled=true;note('Decisão sobre acontecimento registrada.');render()}
function monthResult(){const p=point();const active=Math.max(0,Math.min(S.qty-S.damaged,S.barbers.length));let potential=S.barbers.slice(0,active).reduce((v,b)=>v+([95,116,132][b.skill]+(S.point===4?([8,14,20][b.skill]):0)),0);const match= S.point===0?({20:1,45:.84,75:.52,100:.28}[S.price]):S.point===4?({20:.65,45:.8,75:1,100:1.02}[S.price]):({20:.88,45:1,75:.94,100:.57}[S.price]);let base=p[3]+S.demandBonus+S.reputation*.7;let demand=Math.max(0,Math.round(base*match));let cuts=Math.max(0,Math.round(Math.min(demand,potential*(1+S.process))*(S.closed?S.closed===2?.5:.78:1)));let revenue=cuts*S.price;let commission=S.barbers.length?revenue*(S.barbers.reduce((v,b)=>v+b.commission,0)/S.barbers.length):0;let fixed=p[1]*(S.month>=30?1.07:1)+(p[4])+(S.choices.reception===2?2500:S.choices.reception===3?5000:0);let expense=fixed+commission+cuts*3;let profit=revenue-expense;S.cash+=profit;S.profit+=profit;S.revenue+=revenue;S.reputation=clamp(S.reputation+(cuts>0&&match>.75?.45:-.8)-(S.damaged?1:0),0,100);if(S.rentDiscount>0){let saving=p[1]*.12;S.cash+=saving;S.rentDiscount--;}if(S.rentDebt>0&&S.month>=S.used.rent+4){let pay=Math.min(S.rentDebt,300);S.cash-=pay;S.rentDebt-=pay;}S.history.push({month:S.month,revenue,profit,cash:S.cash,cuts,reputation:S.reputation,actions:S.actionsUsed});S.closed=0;S.demandBonus*=.975;note('Fechamento: '+cuts+' cortes, receita '+money(revenue)+', resultado '+money(profit)+'.');S.month++;S.actionsUsed=0;eventStart();render()}
function advance(){if(S.month===0){S.cash=setupBalance();S.month=1;eventStart();note('Loja inaugurada com '+money(S.cash)+' em caixa.');render();return}if(S.event&&!S.eventHandled&&['ac','offer'].includes(S.event)){alert('Resolva o acontecimento antes de fechar o mês.');return}if(!confirm('Encerrar mês '+S.month+'? As escolhas deste mês serão definitivas.'))return;monthResult()}
function card(title,desc,cost,fn,disabled=false,tag='',image=''){return `<div class="tile">${image}<h3>${title}</h3><p>${desc}</p><strong>${cost===null?'':money(cost)}</strong>${tag?`<span class="tiny">${tag}</span>`:''}<button ${disabled?'disabled':''} onclick="${fn}">${disabled?'Indisponível':'Escolher e confirmar'}</button></div>`}function summary(){return `<div class="bar"><div class="stat">Caixa disponível / saldo atualizado<b class="${S.cash<0?'bad':''}">${money(S.cash)}</b></div><div class="stat">${S.month?'Mês':'Capital inicial'}<b>${S.month||'R$ 100 mil'}${S.month?' / 36':''}</b></div><div class="stat">Profissionais / postos<b>${S.barbers.length} / ${S.qty-S.damaged}</b></div><div class="stat">Reputação<b>${Math.round(S.reputation)}/100</b></div></div>`}function render(){let h=summary();if(!S.ready){h+=`<section><h2>Montagem • ${stages[S.stage]}</h2><div class="progress"><span style="width:${S.stage/12*100}%"></span></div><p class="alert"><b>Capital inicial: R$ 100.000</b> · Total já comprometido: ${money(100000-(S.point===null?100000:setupBalance()))} · <b>Saldo disponível agora: ${money(S.point===null?100000:setupBalance())}</b>. Cada compra será descontada ao confirmar.</p>`;if(S.stage===0)h+=`<div class="grid">${points.map((p,i)=>card(p[0],p[5]+' Aluguel '+money(p[1])+'/mês; caução '+money(p[1]*3)+'; reforma '+money(p[2])+'.',p[1]*3+p[2],`choosePoint(${i})`,false,'',visual('point',i))).join('')}</div>`;else if(S.stage===1)h+=`<div class="grid">${[3,5,7,10].map(n=>card(n+' postos','Cada posto exige cadeira, bancada e espelho.',n*1700,`chooseQty(${n})`,setupBalance()<n*1700)).join('')}</div>`;else if(S.stage>=2&&S.stage<=8){const k=['chair','bench','mirror','waiting','reception','coffee','facade'][S.stage-2];h+=`<div class="grid">${catalog[k].map((o,i)=>card(o[0],k==='coffee'?'Compra única; sem custo mensal de café no jogo.':k==='reception'&&i>=2?'Inclui despesa mensal de equipe.':'Modelo '+(i+1)+' de '+catalog[k].length+'.',o[1]*(S.stage<=4?S.qty:1),`confirmChoice('${k}',${i})`,setupBalance()<o[1]*(S.stage<=4?S.qty:1),'',visual(k,i))).join('')}</div>`}else if(S.stage===9)h+=`<p>Equipe inicial: iniciantes e no máximo um intermediário. Expert somente após seis meses, reputação 70 e caixa suficiente.</p><div class="grid">${[0,1].map(i=>card(['Iniciante','Intermediário'][i],'Comissão mensal sobre o faturamento: '+(i?43:40)+'%.',0,`hire(${i})`,S.barbers.length>=S.qty||(i===1&&S.barbers.some(b=>b.skill===1)))).join('')}</div><p>Contratados: ${S.barbers.length} / ${S.qty}</p><button onclick="startTeam()" ${S.barbers.length?'':'disabled'}>Confirmar equipe e continuar</button>`;else if(S.stage===10)h+=`<div class="grid">${[20,45,75,100].map(v=>card('Corte '+money(v),'Preço altera demanda, faturamento e adequação ao público.',v,`pricePick(${v})`)).join('')}</div>`;else if(S.stage===11)h+=`<div class="grid">${['Cartazes de rua','Parcerias locais','Tráfego pago','Influenciador'].map((t,i)=>card(t,'Ação de divulgação de inauguração; custo descontado imediatamente.',[300,600,2000,5000][i],`marketingPick(${i})`,setupBalance()<[300,600,2000,5000][i])).join('')}</div>`;h+='</section>'}else if(S.month>36){let last=S.history[S.history.length-1];h+=`<section><h2>Resultado final • 36 meses</h2><p>Você chegou ao fim mesmo que tenha acumulado dívidas.</p><div class="bar"><div class="stat">Faturamento total<b>${money(S.revenue)}</b></div><div class="stat">Resultado operacional acumulado<b>${money(S.profit)}</b></div><div class="stat">Caixa final<b>${money(S.cash)}</b></div><div class="stat">Reputação<b>${Math.round(S.reputation)}/100</b></div></div><h3>Resultados por ano</h3>${[0,1,2].map(i=>{let a=S.history.slice(i*12,i*12+12);return `<p>Ano ${i+1}: faturamento ${money(a.reduce((v,x)=>v+x.revenue,0))} • resultado ${money(a.reduce((v,x)=>v+x.profit,0))} • caixa ${money(a[a.length-1].cash)}</p>`}).join('')}<button onclick="location.reload()">Jogar novamente</button></section>`}else{h+=`<section><h2>Mês ${S.month} de 36</h2><p>Até cinco ações neste mês. Investimentos pagos exigem caixa disponível; despesas operacionais podem deixar o saldo negativo. Não existe falência antecipada.</p><div class="bar"><div class="stat">Ações realizadas<b>${S.actionsUsed}/5</b></div><div class="stat">Preço do corte<b>${money(S.price)}</b></div><div class="stat">Postos danificados<b>${S.damaged}</b></div><div class="stat">Seguro válido até<b>${S.insuranceUntil>=S.month?'Mês '+S.insuranceUntil:'Sem cobertura'}</b></div></div>${events[S.month]?`<p class="alert"><b>${events[S.month][0]}:</b> ${events[S.month][1]}</p>`:''}${S.event==='robbery'?`<p class="alert">${S.insuranceUntil>=S.month?'O seguro cobriu os equipamentos, com franquia e dias perdidos.':'Sem seguro: reconstrua postos com dinheiro próprio. Enquanto isso, a capacidade de atendimento fica reduzida.'}</p>`:''}${S.event==='ac'&&!S.eventHandled?`<div class="grid">${card('Consertar ar-condicionado','Restaura conforto.',2500,'resolveEvent(0)',S.cash<2500)}${card('Adiar reparo','Perde reputação e parte dos atendimentos.',0,'resolveEvent(1)')}</div>`:''}${S.event==='offer'&&!S.eventHandled?`<div class="grid">${card('Investir na retenção','Desenvolvimento e negociação.',3000,'resolveEvent(0)',S.cash<3000)}${card('Conversar e manter condições','Risco de insatisfação.',0,'resolveEvent(1)')}${card('Aceitar possível saída','Perde um profissional se houver mais de um.',0,'resolveEvent(2)')}</div>`:''}<h3>Oportunidades deste mês</h3><div class="grid">${actionMenu().map(a=>card(a.name,a.desc,actionCost(a),`take('${a.id}')`,!eligible(a)||actionCost(a)>S.cash||S.actionsUsed>=5,actionCost(a)>S.cash?'Sem caixa':'Disponível conforme calendário')).join('')}</div><hr/><button onclick="advance()">${S.month===36?'Concluir 36 meses':'Encerrar mês e ver resultado'}</button>${S.history.length?`<p class="muted">Último fechamento: ${money(S.history[S.history.length-1].revenue)} faturados; ${money(S.history[S.history.length-1].profit)} de resultado.</p>`:''}</section>`}h+=`<section><h3>Histórico de decisões e resultados</h3><div class="log">${S.log.length?S.log.map(x=>`<p>${x}</p>`).join(''):'Suas escolhas aparecerão aqui.'}</div></section>`;document.getElementById('app').innerHTML=h}render();
</script></body></html>
