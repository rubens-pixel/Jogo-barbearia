imary green" onclick="advanceIdentity(-1)">Continuar →</button></div></div>`;if(s.step===-1)html+=`<div class="panel"><h1>2. Dê um nome à sua barbearia</h1><p>Agora escolha o nome do negócio que você vai construir.</p><label class="field">Nome da barbearia<input type="text" maxlength="90" placeholder="Ex.: Barbearia Futuro" value="${safe(s.shopName)}" oninput="setShopName(this.value)"></label><div class="actions"><button class="secondary" onclick="setStep(-2)">← Voltar</button><button class="primary green" onclick="advanceIdentity(0)">Escolher imóvel →</button></div></div>`;if(s.step===0)html+=`<div class="panel"><h1>3. Escolha onde abrir</h1><p class="muted">Cada imóvel tem custos e procura diferentes. A caução fica retida e não conta como despesa operacional.</p><div class="cards">${props.map(p=>`<button class="choice ${s.prop===p.id?'active':''}" onclick="selectProp('${p.id}')"><img class="location-photo" src="${PHOTO_ASSETS['location_'+p.id]}" alt="Imagem ilustrativa do bairro ${p.name}"><strong>${p.id} · ${p.name}</strong><p>${p.desc}</p><small>Aluguel ${fmt(p.rent)} / mês</small><small>Reforma ${fmt(p.reno)}</small><small>Até ${p.max} postos</small></button>`).join('')}</div>${nav(-1,'setStep(1)',!s.prop)}</div>`;if(s.step===1)html+=`<div class="panel"><h1>Quantos postos você vai montar?</h1><p>Você só poderá contratar barbeiros para postos completos.</p><div class="cards">${Array.from({length:P().max-2},(_,i)=>i+3).map(n=>`<button class="choice ${s.n===n?'active':''}" onclick="count(${n})"><strong>${n} postos</strong><small>${n>3?2:1} lavatório(s) obrigatório(s)</small></button>`).join('')}</div>${nav(0,'stationInit();setStep(2)')}</div>`;if(s.step===2){stationInit();html+=`<div class="panel"><h1>Monte cada posto</h1><p class="muted">Escolha cadeira, bancada e espelho de cada posto. Fotos ilustrativas geradas por IA e incorporadas ao arquivo; não representam modelos de fabricantes. Bancadas e recepções permanecem com desenhos ilustrativos. Signature só fica disponível depois da inauguração.</p><h2>Modelo único de cadeira para todos os ${s.n} postos</h2><p>Escolha uma vez: todas as cadeiras serão iguais. Valor total = preço unitário × ${s.n}.</p><div class="cards">${catalog.chair.slice(0,3).map(([name,price],j)=>`<button class="choice ${s.stations[0].chair===j?'active':''}" onclick="pickItem('chair',0,${j})"><img src="${photo('chair',j)}" alt="Cadeira ${name}"><strong>${name}</strong><small>${fmt(price)} cada · ${fmt(price*s.n)} no total</small></button>`).join('')}</div>${s.stations.map((st,i)=>`<h2>Posto ${i+1}: bancada e espelho</h2>${['bench','mirror'].map(k=>`<h3>${names[k]}</h3><div class="cards">${catalog[k].slice(0,3).map(([name,price],j)=>`<button class="choice ${st[k]===j?'active':''}" onclick="pickItem('${k}',${i},${j})"><img src="${photo(k,j)}" alt="Ilustração de ${names[k]} ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div>`).join('')}`).join('')}${s.wash.map((v,i)=>`<h2>Lavatório ${i+1}</h2><div class="cards">${catalog.wash.map(([name,price],j)=>`<button class="choice ${v===j?'active':''}" onclick="pickItem('wash',${i},${j})"><img src="${photo('wash',j)}" alt="Ilustração lavatório ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div>`).join('')}${nav(1,'setStep(3)',!allEquipment()||setupCost()>100000)}</div>`}if(s.step===3)html+=`<div class="panel"><h1>Conforto e operação</h1><p>Itens opcionais; climatização insuficiente reduz a experiência, sem penalidade fixa automática de faturamento.</p><h3>Ar-condicionado · ${fmt(4000)} cada</h3><div class="cards">${Array.from({length:P().ac+1},(_,i)=>i).map(n=>`<button class="choice ${s.ac===n?'active':''}" onclick="s.ac=${n};render()">${n?`<img src="${PHOTO_ASSETS.ac}" alt="Ar-condicionado ilustrativo">`:""}<strong>${n} aparelho(s)</strong><small>${fmt(n*4000)} ${n===P().ac?'· Climatização adequada':''}</small></button>`).join('')}</div><h3>Recepção física</h3><div class="cards">${catalog.reception.map(([name,price],i)=>`<button class="choice ${s.reception===i?'active':''}" onclick="s.reception=${i};render()"><img src="${photo('reception',i)}" alt="Ilustração recepção ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div><h3>Recepcionista</h3><div class="cards"><button class="choice ${!s.receptionist?'active':''}" onclick="s.receptionist=false;render()">Não contratar</button><button class="choice ${s.receptionist?'active':''}" onclick="s.receptionist=true;render()">Contratar · R$ 2.500/mês</button></div><h3>Limpeza</h3><div class="cards"><button class="choice ${s.clean==='outsourced'?'active':''}" onclick="s.clean='outsourced';render()">Terceirizada · R$ 600/mês</button><button class="choice ${s.clean==='internal'?'active':''}" onclick="s.clean='internal';render()">Interna · R$ 300/mês (usa tempo da equipe)</button></div>${setupCost()>100000?warn('Montagem ultrapassa R$ 100 mil. Reduza algum item.'):''}${nav(2,'setStep(4)',setupCost()>100000)}</div>`;if(s.step===4)html+=`<div class="panel"><h1>Confira seu investimento</h1><div class="line"><span>Caução</span><b>${fmt(P().rent*3)}</b></div><div class="line"><span>Reforma instantânea</span><b>${fmt(P().reno)}</b></div><div class="line"><span>Documentação e materiais iniciais</span><b>${fmt(3000)}</b></div><div class="line"><span>Equipamentos e opcionais</span><b>${fmt(equipCost())}</b></div><div class="line"><span>Total de abertura</span><b>${fmt(setupCost())}</b></div><div class="line"><span>Caixa após abertura</span><b>${fmt(100000-setupCost())}</b></div><div class="line"><span>Despesas mensais conhecidas</span><b>${fmt(fixed())}</b></div>${warn('A reserva não é lucro. O mês 1 começa com a loja aberta; todas as despesas mensais são cobradas integralmente.')}${nav(3,'setStep(5)',setupCost()>100000)}</div>`;if(s.step===5)html+=`<div class="panel"><h1>Contrate sua equipe</h1><p>Você tem ${s.n} postos e ${s.barbers.length} barbeiro(s). Contratar não cria clientes automaticamente. Comissão negociável de 35% a 55%.</p><div class="cards">${candidates().map((c,i)=>`<div class="choice"><strong>${c.name}</strong><p>${c.desc}</p><small>Comissão inicial sugerida: ${c.comm}%</small><button class="primary" onclick="hire(${i})" ${s.barbers.length>=s.n?'disabled':''}>Contratar</button></div>`).join('')}</div><h3>Equipe contratada</h3>${s.barbers.map((b,i)=>`<div class="line"><span>${b.name} <button class="secondary mini" onclick="fire(${i})">Remover</button></span><label>Comissão <select onchange="changeComm(${i},this.value)">${[35,40,45,50,55].map(n=>`<option value="${n}" ${b.comm===n?'selected':''}>${n}%</option>`).join('')}</select></label></div>`).join('')}${nav(4,'setStep(6)',!s.barbers.length)}</div>`;if(s.step===6)html+=`<div class="panel"><h1>Escolha seu posicionamento</h1><p>O preço influencia receita e procura. Serviços extras seguem o posicionamento e habilidade da equipe.</p><div class="cards">${['Econômico','Intermediário','Premium'].map((name,i)=>`<button class="choice ${s.tier===i?'active':''}" onclick="chooseTier(${i})"><strong>${name}</strong><small>Corte ${fmt([40,60,100][i])}</small><small>Extra médio ${fmt([20,35,60][i])}</small></button>`).join('')}</div>${nav(5,'setStep(7)')}</div>`;if(s.step===7)html+=`<div class="panel"><h1>Divulgação e estoque</h1><p>O marketing é escolhido em reais por mês. Produtos custam R$ 30 e são vendidos por R$ 60, limitados ao estoque.</p><label class="field">Marketing mensal (R$)<input type="number" min="0" step="100" value="${s.marketing}" onchange="setMarketing(this.value)"></label><label class="field">Estoque inicial de produtos (unidades)<input type="number" min="0" step="1" value="${s.productStock}" onchange="setStock(this.value)"></label><label class="field">Retirada mensal do dono (R$)<input type="number" min="0" step="100" value="${s.ownerPay}" onchange="setOwner(this.value)"></label><div class="line"><span>Caixa após montagem e estoque</span><b>${fmt(100000-setupCost()-s.productStock*30)}</b></div><div class="line"><span>Despesas mensais + marketing + retirada, antes de comissões</span><b>${fmt(fixed()+s.marketing+s.ownerPay)}</b></div>${100000-setupCost()-s.productStock*30<fixed()+s.marketing?warn('O caixa não cobre as despesas fixas e marketing previstos para o primeiro mês. Ajuste as escolhas para inaugurar.'):''}${nav(6,'finishOpening()',!allEquipment()||!s.barbers.length||setupCost()+s.productStock*30+fixed()+s.marketing>100000,'Inaugurar')}</div>`;if(s.step===8)html+=`<div class="panel"><h1>Sua barbearia está aberta!</h1><p>Reforma instantânea. O primeiro mês já pode faturar. O jogo calcula três fechamentos mensais e entrega um diagnóstico ao fim da rodada.</p><div class="line"><span>Imóvel</span><b>${P().name}</b></div><div class="line"><span>Barbeiros</span><b>${s.barbers.length}</b></div><div class="line"><span>Preço do corte</span><b>${fmt([40,60,100][s.tier])}</b></div><div class="line"><span>Procura-base inicial</span><b>${s.baseDemand} cortes/mês</b></div>${nav(null,'runQuarter()',false,'Simular trimestre')}</div>`;if(s.step===9)html+=reportHTML();if(s.step===10)html+=`<div class="panel"><h1>Decisões da próxima rodada</h1><p>As mudanças passam a valer nos três meses seguintes. A ordem permanece: instalar posto antes de contratar.</p><h3>Estrutura</h3><p>${s.n} de ${P().max} postos. Ampliação Essencial custa ${fmt(catalog.chair[s.stations[0].chair][1]+750+(s.n===3?1500:0))} quando aplicável.</p><button class="secondary" onclick="addStation()" ${s.n>=P().max||s.cash<catalog.chair[s.stations[0].chair][1]+750+(s.n===3?1500:0)?'disabled':''}>Instalar mais um posto</button><button class="secondary" onclick="upgradeAC()" ${s.ac>=P().ac||s.cash<4000?'disabled':''}>Adicionar ar-condicionado · R$ 4.000</button><h3>Melhorar equipamentos</h3><p>Troque um equipamento e receba 50% do valor original do item usado. Signature está liberado após a inauguração.</p><div class="panel"><strong>Modelo de cadeira de todos os postos</strong><label class="field">Trocar todas as cadeiras<select onchange="upgradeItem(0,'chair',Number(this.value))">${catalog.chair.map(([name,price],j)=>`<option value="${j}" ${s.stations[0].chair===j?'selected':''}>${name} · ${fmt((price-Math.round(catalog.chair[s.stations[0].chair][1]*.5))*s.n)} pelas ${s.n} cadeiras</option>`).join('')}</select></label></div>${s.stations.map((st,i)=>`<div class="panel"><strong>Posto ${i+1}</strong>${['bench','mirror'].map(k=>`<label class="field">${names[k]} atual: ${catalog[k][st[k]][0]}<select onchange="upgradeItem(${i},'${k}',Number(this.value))">${catalog[k].map(([name,price],j)=>`<option value="${j}" ${st[k]===j?'selected':''}>${name} · ${fmt(price)} (troca: ${fmt(price-Math.round(catalog[k][st[k]][1]*.5))})</option>`).join('')}</select></label>`).join('')}</div>`).join('')}<h3>Equipe</h3><p>${s.barbers.length} barbeiros para ${s.n} postos.</p><div class="cards">${candidates().map((c,i)=>`<button class="secondary" onclick="hireQuarter(${i})" ${s.barbers.length>=s.n?'disabled':''}>Contratar ${c.name} · ${c.comm}%</button>`).join('')}</div><h3>Preço do corte</h3><div class="cards">${['Econômico','Intermediário','Premium'].map((n,i)=>`<button class="choice ${s.tier===i?'active':''}" onclick="adjustTier(${i})"><strong>${n}</strong><small>${fmt([40,60,100][i])}</small></button>`).join('')}</div><label class="field">Marketing mensal (R$)<input type="number" min="0" step="100" value="${s.marketing}" onchange="adjustMarketing(this.value)"></label><label class="field">Retirada mensal do dono (R$)<input type="number" min="0" step="100" value="${s.ownerPay}" onchange="setOwner(this.value)"></label>${s.cash<fixed()+s.marketing?warn('Atenção: o caixa disponível não cobre o próximo mês de despesas fixas e marketing. O jogo permite continuar, mas há risco de contas atrasadas.'):''}${nav(null,'setStep(8)',false,'Confirmar decisões')}</div>`;if(s.step===11)html+=finalHTML();el.innerHTML=html}render();</script></body></html>
