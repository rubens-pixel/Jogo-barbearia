<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Do Zero ao Futuro — Simulador de Barbearia</title><style>:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#171b32;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#1d1a9b;color:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:22px}header small{display:block;color:#d7e1ff}main{max-width:1100px;margin:20px auto;padding:0 14px 60px}.panel{background:white;border:1px solid #e0e4ed;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #17205a0b}h1,h2,h3{margin:0 0 12px}p{line-height:1.5}.muted{color:#667085}.pill{display:inline-block;background:#e9f7bd;color:#254100;padding:5px 10px;border-radius:30px;font-weight:700;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f5ff;border-radius:12px;padding:12px}.stat b{display:block;font-size:19px;color:#1d1a9b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.choice{border:2px solid #e0e4ed;border-radius:14px;padding:12px;background:#fff;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}.choice.active{border-color:#1d1a9b;background:#f0f0ff}.choice img{width:100%;height:125px;object-fit:contain;background:#f5f6fa;border-radius:10px}.choice strong,.choice small{display:block;margin-top:5px}.choice small{color:#626b7d}button{cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:not-allowed}.primary{border:0;border-radius:12px;padding:13px 18px;background:#1d1a9b;color:white;font-weight:800}.secondary{border:1px solid #b9c0d1;border-radius:12px;padding:12px 16px;background:white;color:#1d1a9b;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.green{background:#b2df20;color:#171b32}.warning{border-left:4px solid #d38a1c;background:#fff7e8;padding:12px;border-radius:8px}.danger{color:#a42330}.good{color:#22773b}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input,.field select{border:1px solid #bdc4d3;border-radius:9px;padding:12px;font:inherit;width:100%}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0f5;padding:9px 0}.line b{text-align:right}.progress{height:7px;background:#dfe3ef;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#b2df20}.mini{font-size:13px}.tag{font-size:12px;color:#1d1a9b;font-weight:800}.history{border-left:3px solid #b2df20;padding-left:12px;margin:12px 0}footer{text-align:center;color:#667085;padding:20px}.nowrap{white-space:nowrap}@media(max-width:600px){header b{font-size:17px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.panel{padding:15px}.stat b{font-size:16px}}</style></head><body><header><div><b>DO ZERO AO FUTURO</b><small>O desafio de construir sua barbearia</small></div><span class="pill">Simulador educativo</span></header><main id="app"></main><footer>Valores fictícios aprovados para o jogo • Simulação simplificada, não projeção de mercado.</footer><script>
'use strict';const fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const props=[{id:'A',name:'Residencial',rent:2500,reno:6000,max:4,fixed:3750,demand:160,ac:1,desc:'Bairro residencial: procura menor, aluguel acessível.'},{id:'B',name:'Bairro misto',rent:4500,reno:11000,max:6,fixed:6220,demand:210,ac:2,desc:'Referência de demanda e equilíbrio entre fluxo e custos.'},{id:'C',name:'Centro comercial',rent:5500,reno:7000,max:6,fixed:7170,demand:250,ac:2,desc:'Mais fluxo, público sensível ao preço.'},{id:'D',name:'Alto padrão',rent:8000,reno:18000,max:5,fixed:10000,demand:170,ac:2,desc:'Menos volume inicial; permite posicionamento premium.'},{id:'E',name:'Rua secundária',rent:3800,reno:10000,max:5,fixed:5320,demand:185,ac:2,desc:'Estacionamento e aluguel intermediário; procura menor que B.'}];const catalog={chair:[['Essencial',1200],['Profissional',2000],['Premium',3200],['Signature',5000]],bench:[['Essencial',500],['Profissional',900],['Premium',1500],['Signature',2500]],mirror:[['Essencial',250],['Profissional',450],['Premium',750],['Signature',1200]],wash:[['Essencial',1500],['Profissional',2800],['Premium',4500]],reception:[['Sem recepção física',0],['Simples',800],['Intermediária',2000],['Premium',4500]]};const names={chair:'Cadeira',bench:'Bancada',mirror:'Espelho',wash:'Lavatório',reception:'Recepção'};const svg=(type,tier)=>{const c=['#777b85','#343f53','#1d1a9b','#b2df20'][tier]||'#343f53';let art=type==='chair'?`<rect x="65" y="45" width="90" height="77" rx="19" fill="${c}"/><rect x="54" y="118" width="112" height="22" rx="9" fill="${c}"/><path d="M78 143 L68 177 M143 143 L154 177 M110 140V181 M75 183H145" stroke="#30333c" stroke-width="9" stroke-linecap="round"/><path d="M49 98H171" stroke="#30333c" stroke-width="11" stroke-linecap="round"/>`:type==='bench'?`<rect x="32" y="85" width="156" height="15" rx="3" fill="${c}"/><rect x="42" y="102" width="136" height="67" rx="4" fill="${c}"/><rect x="49" y="110" width="58" height="48" fill="#d9dfe8"/><rect x="113" y="110" width="58" height="48" fill="#d9dfe8"/><path d="M78 127V140 M141 127V140" stroke="#555" stroke-width="3"/>`:type==='mirror'?`<rect x="54" y="26" width="112" height="150" rx="9" fill="${c}"/><rect x="65" y="37" width="90" height="128" rx="5" fill="#c8e3ee"/><path d="M78 145L138 50" stroke="white" stroke-width="7" opacity=".6"/>`:type==='wash'?`<path d="M50 70Q110 130 170 70L160 115Q110 155 60 115Z" fill="${c}"/><rect x="80" y="137" width="60" height="43" rx="7" fill="#4c5260"/><path d="M110 65V38Q110 26 124 26H141" fill="none" stroke="#555" stroke-width="8"/>`:`<rect x="32" y="65" width="156" height="107" rx="8" fill="${c}"/><rect x="23" y="55" width="174" height="20" rx="5" fill="#363d4b"/><rect x="100" y="96" width="20" height="40" fill="#f1f4f9"/>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="220" height="210" viewBox="0 0 220 210"><rect width="220" height="210" fill="#f5f6fa"/>${art}</svg>`)};let s={step:0,prop:null,n:3,stations:[],wash:[],ac:0,reception:0,receptionist:false,clean:'outsourced',barbers:[],tier:1,marketing:0,month:0,cash:100000,unpaid:0,arrears:0,baseDemand:0,quality:0,history:[],decisions:[],last:null,report:null,bankrupt:false,productStock:0,productSpend:0,ownerPay:0};const el=document.getElementById('app');const P=()=>props.find(p=>p.id===s.prop);const stationCost=()=>s.stations.reduce((sum,st)=>sum+['chair','bench','mirror'].reduce((v,k)=>v+catalog[k][st[k]][1],0),0);const equipCost=()=>stationCost()+s.wash.reduce((a,i)=>a+catalog.wash[i][1],0)+s.ac*4000+catalog.reception[s.reception][1];const setupCost=()=>P()?P().rent*3+P().reno+3000+equipCost():0;const fixed=()=>P()?P().fixed+(s.month>=24?P().rent*.21:s.month>=12?P().rent*.1:0)+s.n*150+(s.clean==='outsourced'?600:300)+(s.receptionist?2500:0):0;const log=(msg)=>s.decisions.push({month:s.month,msg});const setStep=n=>{s.step=n;render()};const stat=()=>`<div class="stats"><div class="stat"><small>Capital disponível</small><b>${fmt(s.month?s.cash:100000-setupCost())}</b></div><div class="stat"><small>Investimento de abertura</small><b>${fmt(setupCost())}</b></div><div class="stat"><small>Custo mensal previsto</small><b>${fmt(fixed())}</b></div></div>`;const nav=(back,next,disabled=false,text='Continuar')=>`<div class="actions">${back===null?'':`<button class="secondary" onclick="setStep(${back})">← Voltar</button>`}<button class="primary green" ${disabled?'disabled':''} onclick="${next}">${text} →</button></div>`;const warn=t=>`<div class="warning">${t}</div>`;const choose=(items,current,fn)=>`<div class="cards">${items.map((x,i)=>`<button class="choice ${current===i?'active':''}" onclick="${fn}(${i})"><img alt="Ilustração do equipamento ${x[0]}" src="${svg('chair',i)}"><strong>${x[0]}</strong><small>${fmt(x[1])}</small></button>`).join('')}</div>`;function selectProp(id){s.prop=id;s.n=clamp(s.n,3,P().max);s.stations=[];s.wash=[];s.ac=0;s.reception=0;render()}function count(n){s.n=n;s.stations=[];s.wash=[];render()}function pickItem(k,i,v){if(k==='wash')s.wash[i]=v;else s.stations[i][k]=v;render()}function stationInit(){while(s.stations.length<s.n)s.stations.push({chair:null,bench:null,mirror:null});s.stations.length=s.n;let min=s.n>3?2:1;while(s.wash.length<min)s.wash.push(null);s.wash.length=min}function selection(k,idx){return `<div class="panel"><h3>${names[k]} ${idx+1}</h3><div class="cards">${catalog[k].map(([name,price],i)=>`<button class="choice ${(k==='wash'?s.wash[idx]:s.stations[idx][k])===i?'active':''}" onclick="pickItem('${k}',${idx},${i})"><img src="${svg(k,i)}" alt="Ilustração ${names[k]} ${name}"><strong>${name}</strong><small>${fmt(price)}${i===3?' · Disponível após inauguração':''}</small></button>`).join('')}</div></div>`}function allEquipment(){return s.stations.length===s.n&&s.stations.every(st=>Object.values(st).every(v=>v!==null&&v!==undefined))&&s.wash.every(v=>v!==null&&v!==undefined)}function candidates(){return [{name:'Iniciante',skill:.86,comm:55,desc:'Menor produtividade e mais necessidade de acompanhamento.'},{name:'Experiente',skill:1,comm:45,desc:'Produtividade e qualidade intermediárias.'},{name:'Especialista',skill:1.08,comm:35,desc:'Maior produtividade e experiência; exige estrutura adequada.'}]}function hire(i){if(s.barbers.length>=s.n)return;const c=candidates()[i];s.barbers.push({...c,id:Date.now()+Math.random(),comm:c.comm});render()}function fire(i){s.barbers.splice(i,1);render()}function changeComm(i,v){s.barbers[i].comm=clamp(Number(v)||35,35,55);render()}function chooseTier(i){s.tier=i;render()}function setMarketing(v){s.marketing=clamp(Math.floor(Number(v)||0),0,100000);render()}function setStock(v){s.productStock=clamp(Math.floor(Number(v)||0),0,1000);render()}function setOwner(v){s.ownerPay=clamp(Math.floor(Number(v)||0),0,100000);render()}function finishOpening(){if(!allEquipment()||!s.barbers.length||setupCost()+s.productStock*30>100000||s.marketing+fixed()>100000-setupCost()-s.productStock*30)return;s.cash=100000-setupCost()-s.productStock*30;s.productSpend=s.productStock*30;s.baseDemand=P().demand;s.month=0;log(`Abriu no imóvel ${s.prop}, ${s.n} postos, ${s.barbers.length} barbeiro(s), preço ${[40,60,100][s.tier]}, marketing ${fmt(s.marketing)}.`);setStep(8)}function calcMonth(){const price=[40,60,100][s.tier],extraPrice=[20,35,60][s.tier],extraMat=[4,7,12][s.tier];const avgSkill=s.barbers.reduce((a,b)=>a+b.skill,0)/s.barbers.length;const capacity=Math.round(s.barbers.reduce((a,b)=>a+clamp(Math.round(175*b.skill*(1+(s.stations.length? s.stations.reduce((v,st)=>v+(st.chair===2?.02:0),0)/s.n:0))),161,190),0));const marketingClients=Math.min(40,Math.floor(s.marketing/500)*10);const priceFactor=s.prop==='D'?(s.tier===2?1:s.tier===1?1.04:1.08):s.tier===2?.78:s.tier===0?1.12:1;const comfort=s.ac<P().ac?-.025:0;const demand=Math.max(0,Math.round((s.baseDemand+marketingClients)*priceFactor));const cuts=Math.min(demand,capacity);const extraRate=avgSkill<.94?.21:avgSkill>1.04?.35:.25;const extras=Math.floor(cuts*extraRate);const revenue=cuts*price+extras*extraPrice;const commRate=s.barbers.reduce((a,b)=>a+b.comm,0)/s.barbers.length/100;const commissions=Math.round(revenue*commRate);const materials=extras*extraMat;const sold=Math.min(s.productStock,Math.floor(cuts*.035));s.productStock-=sold;const productRevenue=sold*60;const costs=fixed()+commissions+materials+s.marketing+s.ownerPay;const profit=revenue+productRevenue-sold*30-costs;const before=s.cash;const available=Math.max(0,s.cash+revenue+productRevenue);const unpaid=Math.max(0,costs+s.arrears-available);s.cash=Math.max(0,available-costs-s.arrears);s.arrears=unpaid;s.unpaid=unpaid>0?s.unpaid+1:0;const rating=(s.ac>=P().ac?.01:comfort)+(avgSkill>=1?.02:-.02)+(s.tier===2&&s.prop==='D'?.02:0)+(cuts/capacity>.92?-.025:.015)+(s.marketing===0?-.01:0);s.quality=rating;const oldDemand=s.baseDemand;if(s.month%3===2)s.baseDemand=Math.max(15,Math.round(s.baseDemand*(rating>.015?1.05:rating<-.015?.95:1)));const r={month:s.month+1,cuts,capacity,demand,revenue,extras,productRevenue,commissions,materials,fixed:fixed(),marketing:s.marketing,ownerPay:s.ownerPay,profit,cash:s.cash,unpaid,arrears:s.arrears,oldDemand,newDemand:s.baseDemand,stock:s.productStock,before};s.history.push(r);s.month++;if(s.unpaid>=3||s.arrears>fixed()*3)s.bankrupt=true;return r}function runQuarter(){if(s.bankrupt||s.month>=36)return;const arr=[];for(let i=0;i<3;i++){arr.push(calcMonth());if(s.bankrupt)break}const sum=k=>arr.reduce((a,r)=>a+r[k],0);const last=arr[arr.length-1],first=arr[0];const observations=[];if(last.cash<fixed()*2)observations.push('Atenção: o caixa cobre menos de dois meses das despesas fixas atuais. Preserve reserva antes de expandir.');if(sum('profit')<0)observations.push('O trimestre teve resultado operacional negativo. Revise a combinação entre preço, movimento, comissões e custos.');else observations.push('O trimestre teve resultado operacional positivo. Confira também se há caixa para sustentar os próximos meses.');if(last.cuts/last.capacity<.55)observations.push('A equipe tem capacidade ociosa. Contratar mais profissionais não aumenta a procura por si só.');if(last.cuts===last.capacity)observations.push('A demanda atingiu a capacidade da equipe. Verifique espaço e caixa antes de ampliar.');if(s.marketing>0&&last.cuts===last.capacity)observations.push('Há marketing ativo com a capacidade ocupada: parte da procura pode não virar atendimento.');if(s.arrears)observations.push(`Há ${fmt(s.arrears)} em contas atrasadas e ${s.unpaid} mês(es) consecutivo(s) de inadimplência.`);if(s.bankrupt)observations.push('A partida terminou por falência, conforme a regra de inadimplência ou limite de dívida.');s.report={arr,profit:sum('profit'),revenue:sum('revenue')+sum('productRevenue'),cuts:sum('cuts'),observations};setStep(9)}function addStation(){if(s.n>=P().max||s.cash<2000)return;const i=s.n;s.n++;s.stations.push({chair:0,bench:0,mirror:0});const needed=s.n>3?2:1;if(s.wash.length<needed)s.wash.push(0);const cost=1950+(s.n===4?1500:0);s.cash-=cost;log(`Ampliou para ${s.n} postos por ${fmt(cost)}.`);render()}function hireQuarter(i){if(s.barbers.length>=s.n)return;hire(i);log(`Contratou ${s.barbers[s.barbers.length-1].name} com comissão de ${s.barbers[s.barbers.length-1].comm}%.`)}function adjustTier(i){s.tier=i;log(`Alterou preço do corte para ${fmt([40,60,100][i])}.`);render()}function adjustMarketing(v){setMarketing(v);log(`Definiu marketing mensal de ${fmt(s.marketing)}.`)}function upgradeItem(idx,k,v){const st=s.stations[idx];const old=st[k];if(old===v)return;const cost=catalog[k][v][1]-Math.round(catalog[k][old][1]*.5);if(cost>s.cash)return;s.cash-=cost;st[k]=v;log(`Melhorou ${names[k].toLowerCase()} do posto ${idx+1} para ${catalog[k][v][0]} por ${fmt(cost)} líquido, após revenda do usado.`);render()}function upgradeAC(){if(s.ac>=P().ac||s.cash<4000)return;s.ac++;s.cash-=4000;log('Comprou um ar-condicionado por R$ 4.000.');render()}function nextQuarter(){if(s.month>=36||s.bankrupt){setStep(11);return}setStep(10)}function reportHTML(){const r=s.report;return `<div class="panel"><span class="pill">Diagnóstico personalizado</span><h2>${s.bankrupt?'Encerramento antecipado':`Trimestre encerrado · mês ${s.month}`}</h2>${stat()}<div class="line"><span>Cortes no trimestre</span><b>${r.cuts}</b></div><div class="line"><span>Faturamento do trimestre</span><b>${fmt(r.revenue)}</b></div><div class="line"><span>Resultado operacional</span><b class="${r.profit>=0?'good':'danger'}">${fmt(r.profit)}</b></div><div class="line"><span>Contas atrasadas</span><b>${fmt(s.arrears)}</b></div><h3 style="margin-top:20px">O que os resultados indicam</h3>${r.observations.map(t=>`<p class="warning">${t}</p>`).join('')}<h3>Fechamentos mensais</h3>${r.arr.map(x=>`<div class="line"><span>Mês ${x.month} · ${x.cuts} cortes</span><b class="${x.profit>=0?'good':'danger'}">${fmt(x.profit)}</b></div>`).join('')}${nav(null,'nextQuarter()',false,s.bankrupt||s.month>=36?'Ver relatório final':'Tomar decisões da próxima rodada')}</div>`}function finalHTML(){const sum=k=>s.history.reduce((a,r)=>a+r[k],0);const losses=s.history.filter(r=>r.profit<0).length;const early=s.history.slice(0,3),late=s.history.slice(-3);const first=early.reduce((a,r)=>a+r.cuts,0),last=late.reduce((a,r)=>a+r.cuts,0);const notes=[];if(s.cash<fixed()*2)notes.push('Reserva final reduzida em relação às despesas fixas: a montagem e os custos mereciam atenção ao longo da trajetória.');else notes.push('A reserva final ajuda a absorver oscilações; manter caixa disponível foi relevante para a continuidade.');if(losses)notes.push(`${losses} mês(es) tiveram prejuízo operacional. Revise os trimestres correspondentes e compare procura, preço e custos.`);if(last>first)notes.push('Os atendimentos cresceram em relação ao trimestre inicial. Avalie quais decisões acompanharam essa evolução.');else if(last<first)notes.push('Os atendimentos caíram em relação ao trimestre inicial. Vale revisar posicionamento, experiência e divulgação.');if(s.bankrupt)notes.push('A empresa encerrou por dívida: observe quando o caixa começou a ficar insuficiente e quais alternativas estavam disponíveis naquele momento.');return `<div class="panel"><span class="pill">Relatório final</span><h1>Sua trajetória</h1><p>${s.bankrupt?'Partida encerrada por falência.':`Você concluiu os ${s.month} meses da simulação.`} As observações abaixo se baseiam nos números desta partida, não em um resultado alternativo garantido.</p><div class="stats"><div class="stat"><small>Meses jogados</small><b>${s.month}/36</b></div><div class="stat"><small>Cortes realizados</small><b>${sum('cuts')}</b></div><div class="stat"><small>Caixa final</small><b>${fmt(s.cash)}</b></div></div><div class="line"><span>Faturamento acumulado</span><b>${fmt(sum('revenue')+sum('productRevenue'))}</b></div><div class="line"><span>Resultado operacional acumulado</span><b>${fmt(sum('profit'))}</b></div><div class="line"><span>Contas pendentes</span><b>${fmt(s.arrears)}</b></div><h2 style="margin-top:20px">Sua abertura</h2><p>Imóvel ${s.prop}, ${s.n} postos ao final, ${s.barbers.length} barbeiros ao final. Investimento de abertura: ${fmt(setupCost())} (a composição atual pode incluir melhorias posteriores).</p><h2>Aprendizados baseados nos resultados</h2>${notes.map(t=>`<p class="warning">${t}</p>`).join('')}<h2>Histórico de decisões</h2>${s.decisions.map(d=>`<div class="history"><small>Mês ${d.month}</small><p>${d.msg}</p></div>`).join('')}<h2>Resultados por mês</h2>${s.history.map(r=>`<div class="line"><span>Mês ${r.month} · ${r.cuts} cortes</span><b>${fmt(r.profit)}</b></div>`).join('')}<div class="actions"><button class="primary" onclick="window.print()">Imprimir / salvar PDF</button><button class="secondary" onclick="location.reload()">Recomeçar</button></div></div>`}function render(){let html=`<div class="panel"><span class="pill">${s.month?`Mês ${s.month} de 36`:`Abertura · etapa ${Math.min(s.step+1,8)} de 8`}</span><div class="progress"><span style="width:${s.month?s.month/36*100:Math.min(s.step+1,8)/8*100}%"></span></div>${stat()}</div>`;if(s.step===0)html+=`<div class="panel"><h1>Escolha onde abrir</h1><p class="muted">Cada imóvel tem custos e procura diferentes. A caução fica retida e não conta como despesa operacional.</p><div class="cards">${props.map(p=>`<button class="choice ${s.prop===p.id?'active':''}" onclick="selectProp('${p.id}')"><strong>${p.id} · ${p.name}</strong><p>${p.desc}</p><small>Aluguel ${fmt(p.rent)} / mês</small><small>Reforma ${fmt(p.reno)}</small><small>Até ${p.max} postos</small></button>`).join('')}</div>${nav(null,'setStep(1)',!s.prop)}</div>`;if(s.step===1)html+=`<div class="panel"><h1>Quantos postos você vai montar?</h1><p>Você só poderá contratar barbeiros para postos completos.</p><div class="cards">${Array.from({length:P().max-2},(_,i)=>i+3).map(n=>`<button class="choice ${s.n===n?'active':''}" onclick="count(${n})"><strong>${n} postos</strong><small>${n>3?2:1} lavatório(s) obrigatório(s)</small></button>`).join('')}</div>${nav(0,'stationInit();setStep(2)')}</div>`;if(s.step===2){stationInit();html+=`<div class="panel"><h1>Monte cada posto</h1><p class="muted">Escolha cadeira, bancada e espelho de cada posto. Imagens ilustrativas, não fotografias de fabricantes. Signature só fica disponível depois da inauguração.</p>${s.stations.map((st,i)=>`<h2>Posto ${i+1}</h2>${['chair','bench','mirror'].map(k=>`<h3>${names[k]}</h3><div class="cards">${catalog[k].slice(0,3).map(([name,price],j)=>`<button class="choice ${st[k]===j?'active':''}" onclick="pickItem('${k}',${i},${j})"><img src="${svg(k,j)}" alt="Ilustração de ${names[k]} ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div>`).join('')}`).join('')}${s.wash.map((v,i)=>`<h2>Lavatório ${i+1}</h2><div class="cards">${catalog.wash.map(([name,price],j)=>`<button class="choice ${v===j?'active':''}" onclick="pickItem('wash',${i},${j})"><img src="${svg('wash',j)}" alt="Ilustração lavatório ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div>`).join('')}${nav(1,'setStep(3)',!allEquipment()||setupCost()>100000)}</div>`}if(s.step===3)html+=`<div class="panel"><h1>Conforto e operação</h1><p>Itens opcionais; climatização insuficiente reduz a experiência, sem penalidade fixa automática de faturamento.</p><h3>Ar-condicionado · ${fmt(4000)} cada</h3><div class="cards">${Array.from({length:P().ac+1},(_,i)=>i).map(n=>`<button class="choice ${s.ac===n?'active':''}" onclick="s.ac=${n};render()"><strong>${n} aparelho(s)</strong><small>${fmt(n*4000)} ${n===P().ac?'· Climatização adequada':''}</small></button>`).join('')}</div><h3>Recepção física</h3><div class="cards">${catalog.reception.map(([name,price],i)=>`<button class="choice ${s.reception===i?'active':''}" onclick="s.reception=${i};render()"><img src="${svg('reception',i)}" alt="Ilustração recepção ${name}"><strong>${name}</strong><small>${fmt(price)}</small></button>`).join('')}</div><h3>Recepcionista</h3><div class="cards"><button class="choice ${!s.receptionist?'active':''}" onclick="s.receptionist=false;render()">Não contratar</button><button class="choice ${s.receptionist?'active':''}" onclick="s.receptionist=true;render()">Contratar · R$ 2.500/mês</button></div><h3>Limpeza</h3><div class="cards"><button class="choice ${s.clean==='outsourced'?'active':''}" onclick="s.clean='outsourced';render()">Terceirizada · R$ 600/mês</button><button class="choice ${s.clean==='internal'?'active':''}" onclick="s.clean='internal';render()">Interna · R$ 300/mês (usa tempo da equipe)</button></div>${setupCost()>100000?warn('Montagem ultrapassa R$ 100 mil. Reduza algum item.'):''}${nav(2,'setStep(4)',setupCost()>100000)}</div>`;if(s.step===4)html+=`<div class="panel"><h1>Confira seu investimento</h1><div class="line"><span>Caução</span><b>${fmt(P().rent*3)}</b></div><div class="line"><span>Reforma instantânea</span><b>${fmt(P( ${nav(5,'setStep(7)')}</div>`;if(s.step===7)html+=`<div class="panel"><h1>Divulgação e estoque</h1><p>O marketing é escolhido em reais por mês. Produtos custam R$ 30 e são vendidos por R$ 60, limitados ao estoque.</p><label class="field">Marketing mensal (R$)<input type="number" min="0" step="100" value="${s.marketing}" onchange="setMarketing(this.value)"></label><label class="field">Estoque inicial de produtos (unidades)<input type="number" min="0" step="1" value="${s.productStock}" onchange="setStock(this.value)"></label><label class="field">Retirada mensal do dono (R$)<input type="number" min="0" step="100" value="${s.ownerPay}" onchange="setOwner(this.value)"></label><div class="line"><span>Caixa após montagem e estoque</span><b>${fmt(100000-setupCost()-s.productStock*30)}</b></div><div class="line"><span>Despesas mensais + marketing + retirada, antes de comissões</span><b>${fmt(fixed()+s.marketing+s.ownerPay)}</b></div>${100000-setupCost()-s.productStock*30<fixed()+s.marketing?warn('O caixa não cobre as despesas fixas e marketing previstos para o primeiro mês. Ajuste as escolhas para inaugurar.'):''}${nav(6,'finishOpening()',!allEquipment()||!s.barbers.length||setupCost()+s.productStock*30+fixed()+s.marketing>100000,'Inaugurar')}</div>`;if(s.step===8)html+=`<div class="panel"><h1>Sua barbearia está aberta!</h1><p>Reforma instantânea. O primeiro mês já pode faturar. O jogo calcula três fechamentos mensais e entrega um diagnóstico ao fim da rodada.</p><div class="line"><span>Imóvel</span><b>${P().name}</b></div><div class="line"><span>Barbeiros</span><b>${s.barbers.length}</b></div><div class="line"><span>Preço do corte</span><b>${fmt([40,60,100][s.tier])}</b></div><div class="line"><span>Procura-base inicial</span><b>${s.baseDemand} cortes/mês</b></div>${nav(null,'runQuarter()',false,'Simular trimestre')}</div>`;if(s.step===9)html+=reportHTML();if(s.step===10)html+=`<div class="panel"><h1>Decisões da próxima rodada</h1><p>As mudanças passam a valer nos três meses seguintes. A ordem permanece: instalar posto antes de contratar.</p><h3>Estrutura</h3><p>${s.n} de ${P().max} postos. Ampliação Essencial custa ${fmt(1950+(s.n===3?1500:0))} quando aplicável.</p><button class="secondary" onclick="addStation()" ${s.n>=P().max||s.cash<1950+(s.n===3?1500:0)?'disabled':''}>Instalar mais um posto</button><button class="secondary" onclick="upgradeAC()" ${s.ac>=P().ac||s.cash<4000?'disabled':''}>Adicionar ar-condicionado · R$ 4.000</button><h3>Melhorar equipamentos</h3><p>Troque um equipamento e receba 50% do valor original do item usado. Signature está liberado após a inauguração.</p>${s.stations.map((st,i)=>`<div class="panel"><strong>Posto ${i+1}</strong>${['chair','bench','mirror'].map(k=>`<label class="field">${names[k]} atual: ${catalog[k][st[k]][0]}<select onchange="upgradeItem(${i},'${k}',Number(this.value))">${catalog[k].map(([name,price],j)=>`<option value="${j}" ${st[k]===j?'selected':''}>${name} · ${fmt(price)} (troca: ${fmt(price-Math.round(catalog[k][st[k]][1]*.5))})</option>`).join('')}</select></label>`).join('')}</div>`).join('')}<h3>Equipe</h3><p>${s.barbers.length} barbeiros para ${s.n} postos.</p><div class="cards">${candidates().map((c,i)=>`<button class="secondary" onclick="hireQuarter(${i})" ${s.barbers.length>=s.n?'disabled':''}>Contratar ${c.name} · ${c.comm}%</button>`).join('')}</div><h3>Preço do corte</h3><div class="cards">${['Econômico','Intermediário','Premium'].map((n,i)=>`<button class="choice ${s.tier===i?'active':''}" onclick="adjustTier(${i})"><strong>${n}</strong><small>${fmt([40,60,100][i])}</small></button>`).join('')}</div><label class="field">Marketing mensal (R$)<input type="number" min="0" step="100" value="${s.marketing}" onchange="adjustMarketing(this.value)"></label><label class="field">Retirada mensal do dono (R$)<input type="number" min="0" step="100" value="${s.ownerPay}" onchange="setOwner(this.value)"></label>${s.cash<fixed()+s.marketing?warn('Atenção: o caixa disponível não cobre o próximo mês de despesas fixas e marketing. O jogo permite continuar, mas há risco de contas atrasadas.'):''}${nav(null,'setStep(8)',false,'Confirmar decisões')}</div>`;if(s.step===11)html+=finalHTML();el.innerHTML=html}render();</script></body></html>
